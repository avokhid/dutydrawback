<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drawback — Choose Type</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#10110F}</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

// ─────────────────────────────────────────────────────────────────────────
// Duty Drawback — Choose Drawback Type
//
// The user declares which drawback basis applies BEFORE the run (not the
// auto-optimizer we discussed earlier — a deliberate product choice). The type
// drives what extra input the flow then collects, which is exactly why choosing
// up front is the right model: you only ask for a bill of materials when the
// user says it's a manufacturing claim.
//
// Sits between "Confirm what we read" and "Run estimate" in the journey.
//
// Driven by GET /api/drawback-types (so options stay in sync with the engine).
// On continue, the chosen id is passed to /api/claim/run-stream?drawback_type=…
//
// Conditional inputs:
//   rejected      → ask for the rejection reason (engine requires it)
//   manufacturing → needs a bill of materials, which is its own input step;
//                   here we honestly route to that rather than fake BOM capture.
// ─────────────────────────────────────────────────────────────────────────

const C = {
  bg: "#10110F", panel: "#181A17", panel2: "#1F221D", line: "#2C302A",
  lineSoft: "#23261F", ink: "#EDEFE9", inkSoft: "#A7AC9E", inkFaint: "#6E7567",
  ok: "#7FB069", okBg: "#1A2417", sel: "#6BA8C9", selBg: "#13202733",
  warn: "#D8A24A", warnBg: "#241E12",
};
const mono = "'JetBrains Mono','SF Mono',ui-monospace,monospace";
const sans = "'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";

// Mirrors GET /api/drawback-types
const TYPES = [
  { id: "unused_substitution", label: "Unused merchandise — substitution",
    statute: "1313(j)(2)", simplest: true,
    desc: "Imported goods exported or destroyed unused; matched to commercially interchangeable substitutes by HTS.",
    requires: [] },
  { id: "unused_direct_identification", label: "Unused merchandise — direct ID",
    statute: "1313(j)(1)",
    desc: "The actual imported goods are exported or destroyed unused.",
    requires: [] },
  { id: "rejected", label: "Rejected merchandise", statute: "1313(c)",
    desc: "Defective, non-conforming, or unauthorized goods returned, exported, or destroyed.",
    requires: ["rejection_reason"] },
  { id: "manufacturing", label: "Manufacturing drawback", statute: "1313(a)/(b)",
    heavier: true,
    desc: "Imported materials consumed making an exported article. Requires a bill of materials linking inputs to outputs.",
    requires: ["bill_of_materials"] },
];

const REJECTION_REASONS = [
  "Defective / did not meet specifications",
  "Not conforming to sample or specification",
  "Shipped without consent of consignee",
  "Determined to be defective after import",
];

function DrawbackTypeStep({ onContinue }) {
  const [selected, setSelected] = useState("unused_substitution");
  const [reason, setReason] = useState(REJECTION_REASONS[0]);

  const sel = TYPES.find((t) => t.id === selected);
  const needsReason = sel.requires.includes("rejection_reason");
  const needsBom = sel.requires.includes("bill_of_materials");

  const continueLabel = needsBom ? "Next: add bill of materials →" : "Run estimate →";

  const handleContinue = () => {
    const payload = { drawback_type: selected };
    if (needsReason) payload.rejection_reason = reason;
    if (needsBom) payload.next = "bill_of_materials"; // journey routes to BOM step
    onContinue && onContinue(payload);
  };

  return (
    <div style={{ minHeight: "100vh", background: C.bg, padding: "44px 24px 80px", fontFamily: sans }}>
      <style>{`*{box-sizing:border-box} button:hover:not(:disabled){filter:brightness(1.08)}
        select:focus{border-color:${C.sel}!important;outline:none}`}</style>

      <div style={{ maxWidth: 660, margin: "0 auto" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 22 }}>
          <div style={{ width: 8, height: 8, borderRadius: 2, background: C.sel }} />
          <span style={{ fontFamily: mono, fontSize: 12.5, letterSpacing: 1, color: C.inkSoft, textTransform: "uppercase" }}>
            Drawback · Choose Type
          </span>
        </div>

        <h1 style={{ fontFamily: sans, fontSize: 22, fontWeight: 600, color: C.ink, margin: "0 0 4px" }}>
          What kind of drawback is this?
        </h1>
        <p style={{ fontFamily: sans, fontSize: 14, color: C.inkSoft, margin: "0 0 22px", lineHeight: 1.6 }}>
          The type determines how we match your shipments and what we need from you.
          If you're not sure, the first option covers the most common case.
        </p>

        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 20 }}>
          {TYPES.map((t) => {
            const active = t.id === selected;
            return (
              <button key={t.id} onClick={() => setSelected(t.id)} style={{
                textAlign: "left", cursor: "pointer", borderRadius: 10, padding: "14px 16px",
                background: active ? C.selBg : C.panel,
                border: active ? `1.5px solid ${C.sel}` : `1px solid ${C.line}`,
                display: "flex", gap: 13, alignItems: "flex-start",
              }}>
                <div style={{
                  width: 18, height: 18, borderRadius: "50%", flexShrink: 0, marginTop: 1,
                  border: active ? `5px solid ${C.sel}` : `2px solid ${C.inkFaint}`,
                  background: C.bg,
                }} />
                <div style={{ flex: 1 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 9, flexWrap: "wrap" }}>
                    <span style={{ fontFamily: sans, fontSize: 14.5, fontWeight: 500, color: C.ink }}>{t.label}</span>
                    <span style={{ fontFamily: mono, fontSize: 11, color: C.inkFaint, border: `1px solid ${C.line}`, borderRadius: 4, padding: "1px 6px" }}>{t.statute}</span>
                    {t.simplest && <span style={{ fontFamily: sans, fontSize: 10.5, color: C.ok, background: C.okBg, borderRadius: 4, padding: "2px 7px" }}>most common</span>}
                    {t.heavier && <span style={{ fontFamily: sans, fontSize: 10.5, color: C.warn, background: C.warnBg, borderRadius: 4, padding: "2px 7px" }}>needs extra info</span>}
                  </div>
                  <div style={{ fontFamily: sans, fontSize: 13, color: C.inkSoft, marginTop: 5, lineHeight: 1.5 }}>{t.desc}</div>
                </div>
              </button>
            );
          })}
        </div>

        {needsReason && (
          <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 10, padding: "16px 18px", marginBottom: 20 }}>
            <label style={{ display: "block", fontFamily: sans, fontSize: 13, fontWeight: 500, color: C.ink, marginBottom: 8 }}>
              Why were the goods rejected?
            </label>
            <p style={{ fontFamily: sans, fontSize: 12.5, color: C.inkSoft, margin: "0 0 10px", lineHeight: 1.5 }}>
              Rejected-merchandise drawback requires a stated reason — it's part of what makes the claim eligible.
            </p>
            <select value={reason} onChange={(e) => setReason(e.target.value)} style={{
              width: "100%", height: 38, padding: "0 12px", fontFamily: sans, fontSize: 13.5,
              color: C.ink, background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 7,
            }}>
              {REJECTION_REASONS.map((r) => <option key={r}>{r}</option>)}
            </select>
          </div>
        )}

        {needsBom && (
          <div style={{ background: C.warnBg, border: `1px solid ${C.warn}44`, borderRadius: 10, padding: "16px 18px", marginBottom: 20, display: "flex", gap: 12 }}>
            <span style={{ color: C.warn, fontSize: 17, lineHeight: 1.2 }}>⚠</span>
            <div style={{ fontFamily: sans, fontSize: 13, color: C.inkSoft, lineHeight: 1.55 }}>
              <span style={{ color: C.ink, fontWeight: 500 }}>Manufacturing needs a bill of materials.</span> We'll
              ask which imported inputs went into each exported article, and in what
              quantities — information that isn't on your entry or export documents.
              The next step collects that before we can estimate.
            </div>
          </div>
        )}

        <button onClick={handleContinue} style={{
          fontFamily: sans, fontSize: 13.5, fontWeight: 500, color: C.bg,
          background: needsBom ? C.warn : C.ok, border: "none", borderRadius: 8,
          padding: "11px 20px", cursor: "pointer",
        }}>{continueLabel}</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(DrawbackTypeStep));
</script></body></html>
