<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duty Drawback — Match Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#10110F;color:#EDEFE9;font-family:sans-serif}#boot{padding:40px;font-family:monospace;color:#A7AC9E}</style>
<script src="/static/vendor/react.production.min.js"></script>
<script src="/static/vendor/react-dom.production.min.js"></script>
<script src="/static/vendor/babel.min.js"></script>
</head>
<body>
<div id="root"><div id="boot">Loading reviewer…</div></div>
<script>
  // Force the classic JSX runtime so Babel compiles JSX to React.createElement
  // (using the global UMD React) instead of injecting an ES `import` that would
  // fail in this non-module script.
  if (window.Babel) {
    Babel.registerPreset("react-classic", {
      presets: [[Babel.availablePresets["react"], { runtime: "classic" }]],
    });
  }
  window.addEventListener("error", function (e) {
    var el = document.getElementById("boot") || document.getElementById("root");
    if (el) el.innerHTML = '<div style="padding:40px;font-family:monospace;color:#C16E5A">UI error: ' +
      (e.message || e) + '<br><br>Open DevTools console (F12) for details.</div>';
  });
  if (!window.React || !window.ReactDOM) {
    var b = document.getElementById("boot");
    if (b) b.textContent = "Failed to load React from /static/vendor. Is the backend serving static files?";
  }
</script>
<script type="text/babel" data-presets="react-classic">
const { useState, useEffect, useCallback } = React;

// ─────────────────────────────────────────────────────────────────────────
// Duty Drawback — Match Reviewer (no-build, live data)
// Fetches from the FastAPI backend on the same origin.
// Served by FastAPI at http://localhost:8000/ so there is no CORS or build step.
// ─────────────────────────────────────────────────────────────────────────

const C = {
  bg: "#10110F", panel: "#181A17", panel2: "#1F221D", line: "#2C302A",
  lineSoft: "#23261F", ink: "#EDEFE9", inkSoft: "#A7AC9E", inkFaint: "#6E7567",
  pass: "#7FB069", passBg: "#1A2417", review: "#D8A24A", reviewBg: "#241E12",
  reject: "#C16E5A", rejectBg: "#241813", accent: "#6BA8C9", accentBg: "#13202733",
};
const mono = "'JetBrains Mono','SF Mono',ui-monospace,monospace";
const sans = "'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";

const REASON_CODES = [
  "Vendor pack configuration differs from default",
  "Conversion factor wrong in source data",
  "Partial shipment / split carton",
  "Re-measured against commercial invoice",
  "Confirmed same item",
  "Other (specify in note)",
];
const FIELD_OPTIONS = [
  "Quantity / unit of measure",
  "HTS classification",
  "Entered value",
  "Date / eligibility window",
  "Item identity (not the same product)",
];

// ── API ──────────────────────────────────────────────────────────────────
async function jget(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} ${url}`);
  return r.json();
}
async function jpost(url, body) {
  const r = await fetch(url, {
    method: "POST",
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) throw new Error(`${r.status} ${url}`);
  return r.json();
}
const api = {
  stats: () => jget("/api/claim/stats"),
  bulk: () => jget("/api/matches?tier=auto_pass"),
  review: () => jget("/api/matches?tier=review"),
  approveBulk: (ids) => jpost("/api/matches/approve", { ids }),
  sendToReview: (ids) => jpost("/api/matches/send-to-review", { ids }),
  approveOne: (id) => jpost(`/api/matches/${encodeURIComponent(id)}/approve`),
  rejectOne: (id) => jpost(`/api/matches/${encodeURIComponent(id)}/reject`),
  correct: (body) => jpost("/api/corrections", body),
};

// ── Atoms ──────────────────────────────────────────────────────────────────
function Pill({ children, color, bg }) {
  return <span style={{ fontFamily: mono, fontSize: 11, letterSpacing: 0.3, padding: "3px 8px", borderRadius: 5, color, background: bg, whiteSpace: "nowrap", border: `1px solid ${color}33` }}>{children}</span>;
}
function confColor(c) { if (c >= 0.9) return C.pass; if (c >= 0.5) return C.review; return C.reject; }
function Key({ children }) {
  return <kbd style={{ fontFamily: mono, fontSize: 10, padding: "2px 6px", borderRadius: 4, background: C.panel2, border: `1px solid ${C.line}`, color: C.inkSoft, marginLeft: 6, lineHeight: 1.4 }}>{children}</kbd>;
}
function cardBtn(accent) { return { textAlign: "left", cursor: "pointer", background: C.panel, border: `1px solid ${C.line}`, borderLeft: `3px solid ${accent}`, borderRadius: 10, padding: "22px 22px 20px", transition: "background .15s" }; }
function primaryBtn(accent, disabled) { return { fontFamily: sans, fontSize: 13.5, fontWeight: 500, color: C.bg, background: accent, border: "none", borderRadius: 8, padding: "9px 16px", cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.4 : 1, display: "inline-flex", alignItems: "center" }; }
function ghostBtn(disabled) { return { fontFamily: sans, fontSize: 13.5, fontWeight: 500, color: C.ink, background: "transparent", border: `1px solid ${C.line}`, borderRadius: 8, padding: "9px 16px", cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.4 : 1, display: "inline-flex", alignItems: "center" }; }
const inputStyle = { width: "100%", boxSizing: "border-box", height: 38, padding: "0 12px", fontFamily: sans, fontSize: 13.5, color: C.ink, background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 7, outline: "none" };
const cbStyle = { width: 16, height: 16, accentColor: C.pass, cursor: "pointer" };
const rowGrid = { display: "grid", gridTemplateColumns: "28px 1fr 1fr 64px", gap: 0, columnGap: 12 };

function ViewHeader({ onBack, title, sub, accent, right, backLabel = "Back" }) {
  return (
    <div style={{ marginBottom: 20 }}>
      <button onClick={onBack} style={{ background: "none", border: "none", color: C.inkFaint, fontFamily: sans, fontSize: 12.5, cursor: "pointer", padding: 0, marginBottom: 12 }}>← {backLabel}</button>
      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
        <span style={{ width: 3, height: 26, background: accent, borderRadius: 2 }} />
        <h2 style={{ fontFamily: sans, fontSize: 20, fontWeight: 600, margin: 0, color: C.ink, letterSpacing: -0.2 }}>{title}</h2>
        {right && <div style={{ marginLeft: "auto" }}>{right}</div>}
      </div>
      <div style={{ fontFamily: sans, fontSize: 13, color: C.inkSoft, marginLeft: 15, marginTop: 3 }}>{sub}</div>
    </div>
  );
}
function Stat({ label, value, color }) {
  return <div><div style={{ fontFamily: mono, fontSize: 22, fontWeight: 600, color }}>{value}</div><div style={{ fontFamily: sans, fontSize: 12, color: C.inkSoft }}>{label}</div></div>;
}
function Toast({ msg }) {
  if (!msg) return null;
  return <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: C.panel2, border: `1px solid ${C.line}`, borderLeft: `3px solid ${msg.color}`, borderRadius: 9, padding: "11px 18px", fontFamily: sans, fontSize: 13, color: C.ink, boxShadow: "0 8px 28px rgba(0,0,0,0.4)", zIndex: 50, maxWidth: 420 }}>{msg.text}</div>;
}

// ── Views ────────────────────────────────────────────────────────────────
function Overview({ stats, onGoBulk, onGoReview }) {
  const total = stats.autoPass + stats.review + stats.approved + stats.rejected;
  const pct = total ? Math.round((stats.approved / total) * 100) : 0;
  return (
    <div style={{ maxWidth: 760, margin: "0 auto" }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: 12, marginBottom: 4 }}>
        <h1 style={{ fontFamily: sans, fontSize: 26, fontWeight: 600, margin: 0, color: C.ink, letterSpacing: -0.3 }}>Claim {stats.claimId}</h1>
        <span style={{ fontFamily: mono, fontSize: 13, color: C.inkFaint }}>{stats.claimant}</span>
      </div>
      <p style={{ fontFamily: sans, fontSize: 14, color: C.inkSoft, margin: "0 0 28px", lineHeight: 1.6 }}>
        {total} proposed matches. The engine cleared the confident ones; your attention goes only to what it couldn't resolve.
      </p>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 28 }}>
        <button onClick={onGoBulk} style={cardBtn(C.pass)}>
          <div style={{ fontFamily: mono, fontSize: 40, fontWeight: 600, color: C.pass, lineHeight: 1 }}>{stats.autoPass}</div>
          <div style={{ fontFamily: sans, fontSize: 14, color: C.ink, marginTop: 8, fontWeight: 500 }}>High confidence — ready to approve</div>
          <div style={{ fontFamily: sans, fontSize: 12.5, color: C.inkSoft, marginTop: 4 }}>Clear the whole batch in one action →</div>
        </button>
        <button onClick={onGoReview} style={cardBtn(C.review)}>
          <div style={{ fontFamily: mono, fontSize: 40, fontWeight: 600, color: C.review, lineHeight: 1 }}>{stats.review}</div>
          <div style={{ fontFamily: sans, fontSize: 14, color: C.ink, marginTop: 8, fontWeight: 500 }}>Needs your review</div>
          <div style={{ fontFamily: sans, fontSize: 12.5, color: C.inkSoft, marginTop: 4 }}>One uncertain field each — confirm or correct →</div>
        </button>
      </div>
      <div style={{ display: "flex", gap: 24, padding: "16px 20px", background: C.panel, border: `1px solid ${C.line}`, borderRadius: 10 }}>
        <Stat label="Approved" value={stats.approved} color={C.pass} />
        <Stat label="Rejected" value={stats.rejected} color={C.reject} />
        <Stat label="Remaining" value={stats.autoPass + stats.review} color={C.ink} />
        <div style={{ marginLeft: "auto", textAlign: "right" }}>
          <div style={{ fontFamily: mono, fontSize: 22, fontWeight: 600, color: C.accent }}>${stats.refund}</div>
          <div style={{ fontFamily: sans, fontSize: 12, color: C.inkSoft }}>refund approved · {pct}% complete</div>
        </div>
      </div>
      <div style={{ marginTop: 16, textAlign: "right", display: "flex", gap: 18, justifyContent: "flex-end", flexWrap: "wrap" }}>
        <a href="/activity" style={{ fontFamily: sans, fontSize: 13, color: C.accent, textDecoration: "none" }}>Watch a pipeline run →</a>
        <a href="/estimate" style={{ fontFamily: sans, fontSize: 13, color: C.accent, textDecoration: "none" }}>View recovery estimate →</a>
        <a href="/how-calculated" style={{ fontFamily: sans, fontSize: 13, color: C.accent, textDecoration: "none" }}>How recovery is calculated →</a>
        <a href="/bom" style={{ fontFamily: sans, fontSize: 13, color: C.accent, textDecoration: "none" }}>Manufacturing bill of materials →</a>
      </div>
    </div>
  );
}

function BulkApprove({ rows, onApprove, onSendToReview, onBack }) {
  const [checked, setChecked] = useState(() => Object.fromEntries(rows.map(r => [r.id, true])));
  useEffect(() => { setChecked(Object.fromEntries(rows.map(r => [r.id, true]))); }, [rows]);
  const selCount = Object.values(checked).filter(Boolean).length;
  const allSel = rows.length > 0 && selCount === rows.length;
  const toggleAll = () => setChecked(Object.fromEntries(rows.map(r => [r.id, !allSel])));
  useEffect(() => {
    const h = (e) => { if (e.key === "Enter" && selCount > 0) { e.preventDefault(); onApprove(rows.filter(r => checked[r.id]).map(r => r.id)); } };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [checked, selCount, rows, onApprove]);

  if (rows.length === 0) {
    return <div style={{ maxWidth: 760, margin: "0 auto" }}><ViewHeader onBack={onBack} title="High-confidence queue" sub="No matches waiting — all cleared or routed to review" accent={C.pass} /></div>;
  }
  return (
    <div style={{ maxWidth: 760, margin: "0 auto" }}>
      <ViewHeader onBack={onBack} title="High-confidence queue" sub={`${rows.length} matches at \u226590% confidence`} accent={C.pass} />
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", margin: "0 0 12px" }}>
        <label style={{ display: "flex", alignItems: "center", gap: 9, cursor: "pointer", fontFamily: sans, fontSize: 13, color: C.inkSoft }}>
          <input type="checkbox" checked={allSel} onChange={toggleAll} style={cbStyle} />{selCount} of {rows.length} selected
        </label>
        <span style={{ fontFamily: sans, fontSize: 12.5, color: C.inkFaint }}>Deselect anything that looks off — it routes to review</span>
      </div>
      <div style={{ border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden" }}>
        <div style={{ ...rowGrid, background: C.panel2, padding: "10px 14px", fontFamily: sans, fontSize: 11.5, color: C.inkFaint, fontWeight: 500, letterSpacing: 0.3, textTransform: "uppercase" }}>
          <div /><div>Import line</div><div>Matched export</div><div style={{ textAlign: "right" }}>Conf.</div>
        </div>
        {rows.map(r => (
          <div key={r.id} style={{ ...rowGrid, padding: "11px 14px", alignItems: "center", borderTop: `1px solid ${C.lineSoft}`, background: checked[r.id] ? "transparent" : C.bg, opacity: checked[r.id] ? 1 : 0.42, transition: "opacity .12s" }}>
            <input type="checkbox" checked={!!checked[r.id]} onChange={() => setChecked(s => ({ ...s, [r.id]: !s[r.id] }))} style={cbStyle} />
            <div style={{ fontFamily: mono, fontSize: 12.5, color: C.ink }}>{r.imp}<div style={{ color: C.inkFaint, fontSize: 11, marginTop: 2 }}>{r.impHts} · {r.impQty}</div></div>
            <div style={{ fontFamily: mono, fontSize: 12.5, color: C.ink }}>{r.exp} <span style={{ color: C.pass }}>✓</span><div style={{ color: C.inkFaint, fontSize: 11, marginTop: 2 }}>{r.expHts} · {r.expQty}</div></div>
            <div style={{ textAlign: "right", fontFamily: mono, fontSize: 13, fontWeight: 600, color: confColor(r.conf) }}>{Math.round(r.conf * 100)}%</div>
          </div>
        ))}
      </div>
      <div style={{ display: "flex", gap: 10, marginTop: 16, alignItems: "center" }}>
        <button onClick={() => onApprove(rows.filter(r => checked[r.id]).map(r => r.id))} disabled={!selCount} style={primaryBtn(C.pass, !selCount)}>Approve selected ({selCount}) <Key>⏎</Key></button>
        <button onClick={() => onSendToReview(rows.filter(r => !checked[r.id]).map(r => r.id))} disabled={selCount === rows.length} style={ghostBtn(selCount === rows.length)}>Send unchecked to review</button>
      </div>
    </div>
  );
}

function renderProof(p) {
  if (!p.highlight || !p.line.includes(p.highlight)) return <span>{p.line}</span>;
  const parts = p.line.split(p.highlight);
  return <span>{parts[0]}<span style={{ background: C.reviewBg, color: C.review, padding: "1px 5px", borderRadius: 3, border: `1px solid ${C.review}55` }}>{p.highlight}</span>{parts[1]}</span>;
}

function SingleReview({ item, index, total, onApprove, onReject, onCorrect, onBack, onSkip }) {
  const [showProof, setShowProof] = useState(false);
  useEffect(() => {
    const h = (e) => {
      if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
      const k = e.key.toLowerCase();
      if (k === "a") { e.preventDefault(); onApprove(item.id); }
      else if (k === "e") { e.preventDefault(); onCorrect(item); }
      else if (k === "r") { e.preventDefault(); onReject(item.id); }
      else if (k === "p") { e.preventDefault(); setShowProof(s => !s); }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [item, onApprove, onReject, onCorrect]);
  const rows = Object.entries(item.fields);
  return (
    <div style={{ maxWidth: 760, margin: "0 auto" }}>
      <ViewHeader onBack={onBack} title="Match review" sub={`Item ${index + 1} of ${total} · ${item.vendor} ${item.part}`} accent={C.review}
        right={<Pill color={confColor(item.conf)} bg={C.reviewBg}>{Math.round(item.conf * 100)}% confidence</Pill>} />
      <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 12, overflow: "hidden" }}>
        <div style={{ display: "grid", gridTemplateColumns: "130px 1fr 1fr", background: C.panel2, padding: "10px 16px", fontFamily: sans, fontSize: 11.5, color: C.inkFaint, fontWeight: 500, textTransform: "uppercase", letterSpacing: 0.3 }}>
          <div>Field</div><div>↓ Import · 7501</div><div>↓ Export · BOL</div>
        </div>
        {rows.map(([key, f]) => {
          const flagged = key === item.uncertain;
          return (
            <div key={key} style={{ display: "grid", gridTemplateColumns: "130px 1fr 1fr", padding: "12px 16px", borderTop: `1px solid ${C.lineSoft}`, alignItems: "center", background: flagged ? C.reviewBg : "transparent" }}>
              <div style={{ fontFamily: sans, fontSize: 12.5, color: flagged ? C.review : C.inkSoft, fontWeight: flagged ? 600 : 400 }}>{f.label}{flagged && " ⚠"}</div>
              <div style={{ fontFamily: mono, fontSize: 13, color: C.ink }}>{f.imp}</div>
              <div style={{ fontFamily: mono, fontSize: 13, color: C.ink }}>{f.exp}{f.ok && !flagged && <span style={{ color: C.pass, marginLeft: 6 }}>✓</span>}{f.note && <span style={{ color: f.ok ? C.pass : C.review, fontSize: 11, marginLeft: 6, fontFamily: sans }}>{f.note}</span>}</div>
            </div>
          );
        })}
        <div style={{ display: "flex", gap: 11, padding: "13px 16px", background: C.accentBg, borderTop: `1px solid ${C.lineSoft}` }}>
          <span style={{ color: C.accent, fontSize: 16, lineHeight: 1.2 }}>◆</span>
          <div style={{ fontFamily: sans, fontSize: 13, color: C.inkSoft, lineHeight: 1.55 }}><span style={{ color: C.ink, fontWeight: 500 }}>{item.suggestion.text}.</span> {item.suggestion.detail}.</div>
        </div>
        <div style={{ borderTop: `1px solid ${C.lineSoft}` }}>
          <button onClick={() => setShowProof(s => !s)} style={{ width: "100%", textAlign: "left", background: "none", border: "none", cursor: "pointer", padding: "11px 16px", fontFamily: sans, fontSize: 12.5, color: C.accent, display: "flex", alignItems: "center", gap: 7 }}>
            <span style={{ fontSize: 11 }}>{showProof ? "▾" : "▸"}</span> Source proof — {item.proof.source} <Key>P</Key>
          </button>
          {showProof && <div style={{ margin: "0 16px 14px", padding: "11px 13px", background: C.bg, border: `1px solid ${C.line}`, borderRadius: 7, fontFamily: mono, fontSize: 12, color: C.inkSoft, lineHeight: 1.7 }}>{renderProof(item.proof)}</div>}
        </div>
      </div>
      <div style={{ display: "flex", gap: 10, marginTop: 16, flexWrap: "wrap", alignItems: "center" }}>
        <button onClick={() => onApprove(item.id)} style={primaryBtn(C.pass)}>Approve match <Key>A</Key></button>
        <button onClick={() => onCorrect(item)} style={ghostBtn()}>Correct field <Key>E</Key></button>
        <button onClick={() => onReject(item.id)} style={ghostBtn()}>Reject <Key>R</Key></button>
        <button onClick={onSkip} style={{ ...ghostBtn(), marginLeft: "auto", borderColor: "transparent", color: C.inkFaint }}>Skip for now →</button>
      </div>
    </div>
  );
}

function FieldRow({ label, children, flex }) {
  return <div style={{ marginBottom: 14, flex: flex ? 1 : undefined }}><label style={{ display: "block", fontFamily: sans, fontSize: 12.5, fontWeight: 500, color: C.inkSoft, marginBottom: 6 }}>{label}</label>{children}</div>;
}
function CorrectionForm({ item, onSave, onCancel }) {
  const [field, setField] = useState(FIELD_OPTIONS[0]);
  const [corrected, setCorrected] = useState(item.suggestion.text);
  const [reason, setReason] = useState(REASON_CODES[0]);
  const [note, setNote] = useState("");
  const [asRule, setAsRule] = useState(true);
  return (
    <div style={{ maxWidth: 760, margin: "0 auto" }}>
      <ViewHeader onBack={onCancel} title="Correct match" sub={`${item.vendor} ${item.part}`} accent={C.review} backLabel="Cancel" />
      <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 12, padding: "20px 22px" }}>
        <FieldRow label="Field being corrected"><select value={field} onChange={e => setField(e.target.value)} style={inputStyle}>{FIELD_OPTIONS.map(o => <option key={o}>{o}</option>)}</select></FieldRow>
        <div style={{ display: "flex", gap: 12 }}>
          <FieldRow label="System proposed" flex><div style={{ ...inputStyle, color: C.inkFaint, background: C.bg, display: "flex", alignItems: "center" }}>{item.suggestion.text}</div></FieldRow>
          <FieldRow label="Corrected value" flex><input value={corrected} onChange={e => setCorrected(e.target.value)} style={inputStyle} /></FieldRow>
        </div>
        <FieldRow label="Reason code"><select value={reason} onChange={e => setReason(e.target.value)} style={inputStyle}>{REASON_CODES.map(o => <option key={o}>{o}</option>)}</select></FieldRow>
        <FieldRow label="Note (optional, for audit)"><textarea value={note} onChange={e => setNote(e.target.value)} rows={2} placeholder="e.g. Confirmed against packing list PL-4471." style={{ ...inputStyle, resize: "vertical", lineHeight: 1.5, padding: "9px 12px", height: "auto" }} /></FieldRow>
        <label style={{ display: "flex", gap: 11, padding: "13px 14px", background: C.accentBg, borderRadius: 8, cursor: "pointer", marginTop: 4 }}>
          <input type="checkbox" checked={asRule} onChange={e => setAsRule(e.target.checked)} style={{ ...cbStyle, accentColor: C.accent, marginTop: 2 }} />
          <span style={{ fontFamily: sans, fontSize: 13, color: C.inkSoft, lineHeight: 1.55 }}>Save as reusable rule — apply <b style={{ color: C.ink, fontWeight: 600 }}>{corrected}</b> to future matches from <span style={{ fontFamily: mono }}>{item.vendor}</span> part <span style={{ fontFamily: mono }}>{item.part}</span>.</span>
        </label>
        <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
          <button onClick={() => onSave({ field, corrected, reason, note, asRule })} style={primaryBtn(C.review)}>Save correction</button>
          <button onClick={onCancel} style={ghostBtn()}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

// ── App shell ───────────────────────────────────────────────────────────────
function App() {
  const [view, setView] = useState("overview");
  const [stats, setStats] = useState(null);
  const [bulkRows, setBulkRows] = useState([]);
  const [queue, setQueue] = useState([]);
  const [reviewIdx, setReviewIdx] = useState(0);
  const [correcting, setCorrecting] = useState(null);
  const [toast, setToast] = useState(null);
  const [error, setError] = useState(null);

  const flash = useCallback((text, color) => { setToast({ text, color }); setTimeout(() => setToast(null), 2600); }, []);

  const refresh = useCallback(async () => {
    const [s, b, r] = await Promise.all([api.stats(), api.bulk(), api.review()]);
    setStats(s); setBulkRows(b); setQueue(r);
    setReviewIdx(i => (i >= r.length ? Math.max(0, r.length - 1) : i));
    if (r.length === 0) setCorrecting(null);
  }, []);

  useEffect(() => { refresh().catch(e => setError(String(e))); }, [refresh]);

  const approveBulk = async (ids) => { await api.approveBulk(ids); await refresh(); flash(`${ids.length} matches approved and written to the audit trail.`, C.pass); setView("overview"); };
  const sendBulkToReview = async (ids) => { await api.sendToReview(ids); await refresh(); flash(`${ids.length} match${ids.length === 1 ? "" : "es"} routed to detailed review.`, C.review); };
  const approveOne = async (id) => { const wasLast = queue.length <= 1; await api.approveOne(id); await refresh(); flash("Match approved. Advancing to next.", C.pass); if (wasLast) setView("overview"); };
  const rejectOne = async (id) => { const wasLast = queue.length <= 1; await api.rejectOne(id); await refresh(); flash("Match rejected. Import line returned to the unmatched pool.", C.reject); if (wasLast) setView("overview"); };
  const skip = () => setReviewIdx(i => (queue.length ? (i + 1) % queue.length : 0));
  const saveCorrection = async (data) => {
    if (!correcting) return;
    const wasLast = queue.length <= 1;
    const res = await api.correct({ match_id: correcting.id, field: data.field, system_value: correcting.suggestion.text, corrected: data.corrected, reason: data.reason, note: data.note, asRule: data.asRule });
    setCorrecting(null); await refresh();
    if (data.asRule && res.impact > 0) { flash(`Correction saved · rule created · ${res.impact} matches auto-resolved.`, C.accent); setView("overview"); }
    else { flash("Correction saved to this match and the audit trail.", C.pass); if (wasLast) setView("overview"); }
  };

  const reviewItem = queue[reviewIdx];

  return (
    <div style={{ minHeight: "100vh", background: C.bg, padding: "40px 24px 80px", fontFamily: sans }}>
      <style>{`* { box-sizing: border-box; } button:hover:not(:disabled){ filter: brightness(1.08); } select,input,textarea{ font-family:${sans}; } select:focus,input:focus,textarea:focus{ border-color:${C.accent} !important; } ::placeholder{ color:${C.inkFaint}; } @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }`}</style>
      <div style={{ maxWidth: 760, margin: "0 auto 22px", display: "flex", alignItems: "center", gap: 10 }}>
        <div style={{ width: 8, height: 8, borderRadius: 2, background: C.review }} />
        <span style={{ fontFamily: mono, fontSize: 12.5, letterSpacing: 1, color: C.inkSoft, textTransform: "uppercase" }}>Drawback · Match Reviewer</span>
      </div>

      {error && <div style={{ maxWidth: 760, margin: "0 auto 20px", padding: "11px 16px", background: C.rejectBg, border: `1px solid ${C.reject}`, borderRadius: 8, color: C.reject, fontFamily: sans, fontSize: 13 }}>Could not reach the backend API ({error}). Make sure the FastAPI server is running on this port.</div>}
      {!stats && !error && <p style={{ maxWidth: 760, margin: "0 auto", color: C.inkSoft, fontFamily: sans }}>Loading claim…</p>}

      {stats && view === "overview" && <Overview stats={stats} onGoBulk={() => setView("bulk")} onGoReview={() => { if (queue.length) { setReviewIdx(0); setView("review"); } }} />}
      {stats && view === "bulk" && <BulkApprove rows={bulkRows} onApprove={approveBulk} onSendToReview={sendBulkToReview} onBack={() => setView("overview")} />}
      {stats && view === "review" && reviewItem && !correcting && <SingleReview item={reviewItem} index={reviewIdx} total={queue.length} onApprove={approveOne} onReject={rejectOne} onCorrect={setCorrecting} onBack={() => setView("overview")} onSkip={skip} />}
      {stats && view === "review" && correcting && <CorrectionForm item={correcting} onSave={saveCorrection} onCancel={() => setCorrecting(null)} />}
      {stats && view === "review" && !reviewItem && !correcting && <div style={{ maxWidth: 760, margin: "0 auto", color: C.inkSoft, fontFamily: sans }}><p>Review queue empty.</p><button onClick={() => setView("overview")} style={{ color: C.accent, background: "none", border: "none", cursor: "pointer" }}>← Back to overview</button></div>}

      <Toast msg={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
