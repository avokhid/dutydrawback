<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duty Drawback — Pipeline Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#10110F;color:#EDEFE9;font-family:sans-serif}#boot{padding:40px;font-family:monospace;color:#A7AC9E}</style>
<script src="/static/vendor/react.production.min.js"></script>
<script src="/static/vendor/react-dom.production.min.js"></script>
<script src="/static/vendor/babel.min.js"></script>
</head>
<body>
<div id="root"><div id="boot">Loading pipeline…</div></div>
<script>
  if (window.Babel) {
    Babel.registerPreset("react-classic", {
      presets: [[Babel.availablePresets["react"], { runtime: "classic" }]],
    });
  }
  window.addEventListener("error", function (e) {
    var el = document.getElementById("boot") || document.getElementById("root");
    if (el) el.innerHTML = '<div style="padding:40px;font-family:monospace;color:#C16E5A">UI error: ' +
      (e.message || e) + '<br><br>Open DevTools console (F12) for details.</div>';
  });
  if (!window.React || !window.ReactDOM) {
    var b = document.getElementById("boot");
    if (b) b.textContent = "Failed to load React from /static/vendor. Is the backend serving static files?";
  }
</script>
<script type="text/babel" data-presets="react-classic">
const { useState, useEffect, useRef } = React;

// ─────────────────────────────────────────────────────────────────────────
// Duty Drawback — Pipeline Activity Feed (no-build, live data)
//
// Consumes GET /api/claim/run-stream (Server-Sent Events) and renders each
// orchestrator StageEvent as it arrives — validate, match, calculate, done.
// Same design as ActivityFeed.jsx, but reads the real stream instead of the
// simulated SCRIPT. The stream is closed on the terminal "done" event so the
// browser's EventSource does not auto-reconnect and re-run the pipeline.
// ─────────────────────────────────────────────────────────────────────────

const C = {
  bg: "#10110F", panel: "#181A17", panel2: "#1F221D", line: "#2C302A",
  lineSoft: "#23261F", ink: "#EDEFE9", inkSoft: "#A7AC9E", inkFaint: "#6E7567",
  run: "#6BA8C9", runBg: "#13202722", done: "#7FB069", doneBg: "#1A2417",
  pause: "#D8A24A", pauseBg: "#241E12", err: "#C16E5A",
};
const mono = "'JetBrains Mono','SF Mono',ui-monospace,monospace";
const sans = "'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";

const STAGE_LABELS = {
  validate: "Checking your documents",
  match: "Pairing imports to exports",
  calculate: "Estimating your recovery",
  done: "Done",
  parse: "Reading your files",
};

function statusColor(s) {
  return s === "complete" ? C.done : s === "running" ? C.run : s === "paused" ? C.pause : s === "error" ? C.err : C.inkSoft;
}
function statusBg(s) {
  return s === "complete" ? C.doneBg : s === "running" ? C.runBg : s === "paused" ? C.pauseBg : "transparent";
}

function ActivityFeed() {
  const [events, setEvents] = useState([]);
  const [running, setRunning] = useState(false);
  const [done, setDone] = useState(false);
  const [error, setError] = useState(null);
  const [docs, setDocs] = useState([]);
  const esRef = useRef(null);

  useEffect(() => {
    fetch("/api/claim/source-documents")
      .then((r) => r.json())
      .then((d) => setDocs(d.documents || []))
      .catch(() => {});
  }, []);

  const pushEvent = (ev) => {
    setEvents((prev) => {
      // collapse running -> complete for the same stage into one updating row
      const next = [...prev];
      const idx = next.findIndex((e) => e.stage === ev.stage && e.stage !== "done");
      if (idx >= 0 && ev.stage !== "done") next[idx] = ev;
      else next.push(ev);
      return next;
    });
  };

  const run = () => {
    if (esRef.current) esRef.current.close();
    setEvents([]); setDone(false); setError(null); setRunning(true);
    const params = new URLSearchParams(window.location.search);
    const dtype = params.get("drawback_type") || "unused_substitution";
    const es = new EventSource("/api/claim/run-stream?drawback_type=" + encodeURIComponent(dtype));
    esRef.current = es;
    es.onmessage = (msg) => {
      let ev;
      try { ev = JSON.parse(msg.data); } catch (_) { return; }
      pushEvent(ev);
      if (ev.stage === "done") {
        es.close();
        esRef.current = null;
        setRunning(false);
        setDone(true);
      }
    };
    es.onerror = () => {
      // SSE fires onerror on normal close too; only surface if we never finished
      es.close();
      esRef.current = null;
      setRunning(false);
      setEvents((prev) => {
        if (!prev.some((e) => e.stage === "done")) setError("Stream interrupted before completion.");
        return prev;
      });
    };
  };

  useEffect(() => () => { if (esRef.current) esRef.current.close(); }, []);

  const refundEvent = events.find((e) => e.detail && e.detail.refund);
  const refund = refundEvent ? refundEvent.detail.refund : null;

  return (
    <div style={{ minHeight: "100vh", background: C.bg, padding: "44px 24px 80px", fontFamily: sans }}>
      <style>{`*{box-sizing:border-box} button:hover:not(:disabled){filter:brightness(1.1)}
        a.nav{color:#6E7567;text-decoration:none;font-size:12.5px} a.nav:hover{color:#A7AC9E}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
        .pulsing{animation:pulse 1.1s ease-in-out infinite}
        @media (prefers-reduced-motion:reduce){.pulsing{animation:none}}`}</style>

      <div style={{ maxWidth: 680, margin: "0 auto" }}>
        <a className="nav" href="/reviewer" style={{ display: "inline-block", marginBottom: 20 }}>← Reviewer console</a>

        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 24 }}>
          <div style={{ width: 8, height: 8, borderRadius: 2, background: C.run }} />
          <span style={{ fontFamily: mono, fontSize: 12.5, letterSpacing: 1, color: C.inkSoft, textTransform: "uppercase" }}>
            Drawback · Pipeline Run
          </span>
        </div>

        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20, flexWrap: "wrap", gap: 12 }}>
          <div>
            <h1 style={{ fontFamily: sans, fontSize: 22, fontWeight: 600, color: C.ink, margin: 0 }}>Estimate run</h1>
            <div style={{ fontFamily: sans, fontSize: 13, color: C.inkSoft, marginTop: 3 }}>
              Watch each step as it runs on your documents
            </div>
          </div>
          <button onClick={run} disabled={running} style={{
            fontFamily: sans, fontSize: 13.5, fontWeight: 500, color: running ? C.inkFaint : C.bg,
            background: running ? C.panel2 : C.run, border: "none", borderRadius: 8,
            padding: "9px 18px", cursor: running ? "default" : "pointer",
          }}>{running ? "Running…" : done ? "Run again" : "Run pipeline"}</button>
        </div>

        {docs.length > 0 && (
          <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 10, padding: "13px 16px", marginBottom: 16 }}>
            <div style={{ fontFamily: sans, fontSize: 12, color: C.inkFaint, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.4 }}>
              Source documents
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
              {docs.map((d) => (
                <span key={d.id} style={{ display: "inline-flex", alignItems: "center", gap: 6, fontFamily: mono, fontSize: 12.5, color: C.inkSoft, background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 6, padding: "5px 10px" }}>
                  <span style={{ color: C.inkFaint }}>▤</span>{d.document}
                </span>
              ))}
            </div>
          </div>
        )}

        <div style={{ border: `1px solid ${C.line}`, borderRadius: 12, overflow: "hidden", background: C.panel }}>
          {events.length === 0 && (
            <div style={{ padding: "40px 20px", textAlign: "center", fontFamily: sans, fontSize: 13.5, color: C.inkFaint }}>
              Press “Run pipeline” to watch the stages execute.
            </div>
          )}
          {events.map((ev, i) => (
            <div key={i} style={{
              display: "flex", alignItems: "flex-start", gap: 13, padding: "14px 18px",
              borderTop: i > 0 ? `1px solid ${C.lineSoft}` : "none",
              background: statusBg(ev.status),
            }}>
              <div className={ev.status === "running" ? "pulsing" : ""} style={{
                width: 9, height: 9, borderRadius: "50%", marginTop: 5, flexShrink: 0,
                background: statusColor(ev.status),
              }} />
              <div style={{ flex: 1 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
                  <span style={{ fontFamily: sans, fontSize: 13.5, fontWeight: 500, color: C.ink }}>
                    {STAGE_LABELS[ev.stage] || ev.stage}
                  </span>
                  <span style={{ fontFamily: mono, fontSize: 10.5, letterSpacing: 0.4, textTransform: "uppercase",
                    color: statusColor(ev.status), border: `1px solid ${statusColor(ev.status)}44`,
                    borderRadius: 4, padding: "1px 6px" }}>{ev.status}</span>
                </div>
                <div style={{ fontFamily: sans, fontSize: 13, color: C.inkSoft, marginTop: 4, lineHeight: 1.5 }}>
                  {ev.summary}
                </div>
                {ev.detail && ev.detail.review > 0 && (
                  <div style={{ fontFamily: sans, fontSize: 12, color: C.pause, marginTop: 5 }}>
                    {ev.detail.review} pairing(s) need your confirmation
                  </div>
                )}
              </div>
            </div>
          ))}
        </div>

        {error && (
          <div style={{ marginTop: 14, fontFamily: sans, fontSize: 13, color: C.err }}>{error}</div>
        )}

        {done && refund && (
          <div style={{ marginTop: 16, background: C.panel, border: `1px solid ${C.line}`, borderLeft: `3px solid ${C.done}`,
            borderRadius: 10, padding: "16px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
            <div>
              <div style={{ fontFamily: sans, fontSize: 13, color: C.inkSoft }}>Estimated recovery</div>
              <div style={{ fontFamily: mono, fontSize: 26, fontWeight: 600, color: C.done, marginTop: 2 }}>
                ${Number(refund).toLocaleString("en-US", { minimumFractionDigits: 2 })}
              </div>
            </div>
            <div style={{ fontFamily: sans, fontSize: 12, color: C.inkFaint, maxWidth: 280, lineHeight: 1.5 }}>
              Estimate, not a filing. Includes review-tier matches as additional potential.
              <div style={{ marginTop: 8 }}>
                <a href="/how-calculated" style={{ color: C.run, textDecoration: "none", fontSize: 12.5 }}>See how this is calculated →</a>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ActivityFeed />);
</script>
</body>
</html>
