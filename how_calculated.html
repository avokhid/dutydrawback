<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Drawback — How it's calculated</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#10110F}</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head><body><div id="root"></div><script type="text/babel" data-presets="react">
const { useState } = React;

// ─────────────────────────────────────────────────────────────────────────
// Duty Drawback — "How it's calculated"
//
// Turns a refund line from a black box into a visible derivation. Renders the
// steps from explanation.explain_line_json() — the real arithmetic the engine
// computed, with the law behind each step. Progressive disclosure: the number
// is the headline, the steps are one tap away, the legal citations are one tap
// beyond that. A prospect sees the math; a broker can drill to the statute.
//
// Wire: GET /api/claim/line/{id}/explanation → explain_line_json(). Here it runs
// on a sample explanation with the same shape.
// ─────────────────────────────────────────────────────────────────────────

const C = {
  bg: "#10110F", panel: "#181A17", panel2: "#1F221D", line: "#2C302A",
  lineSoft: "#23261F", ink: "#EDEFE9", inkSoft: "#A7AC9E", inkFaint: "#6E7567",
  ok: "#7FB069", okBg: "#1A2417", accent: "#6BA8C9", accentBg: "#13202722",
  warn: "#D8A24A",
};
const mono = "'JetBrains Mono','SF Mono',ui-monospace,monospace";
const sans = "'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";

// Mirrors explanation.explain_line_json()
const SAMPLE = {
  export_id: "BOL-77", import_line: 1, refund: "2970.00", capped: true,
  drawback_type: "unused_substitution",
  steps: [
    { text: "You paid duties, taxes, and fees on the imported goods. Spread across the 1,000 units being claimed, that's $5.00 per unit.",
      math: "$5.00 per unit × 1,000 units = $5,000.00 claimed", basis: null },
    { text: "Drawback refunds 99% of what you paid — 1% is retained.",
      math: "$5,000.00 × 99% = $4,950.00",
      basis: "19 U.S.C. 1313 — drawback refunds 99% of duties, taxes, and fees",
      tier: "statute", tier_label: "Statute / regulation", certainty: "Firmly codified" },
    { text: "Because this is a substitution claim, the refund is capped at the lower of the imported or exported article's duty. The exported article's duty was lower, so the cap applies and reduces the refund.",
      math: "capped at $2,970.00 (below $4,950.00)",
      basis: "19 U.S.C. 1313(j)(2) — substitution; refund limited to the lesser-of basis",
      tier: "statute", tier_label: "Statute / regulation", certainty: "Firmly codified" },
    { text: "Estimated recovery for this line:", math: "= $2,970.00", basis: null },
  ],
};

function HowItsCalculated({ data = SAMPLE }) {
  const [open, setOpen] = useState(true);
  const [showLaw, setShowLaw] = useState(true);
  const [showRulings, setShowRulings] = useState(false);

  // Mirrors GET /api/rulings/relevant and GET /api/advisory
  const RULINGS = [
    { ruling_id: "SAMPLE-H000001", date: "2021-05-12", is_sample: true,
      issue: "Substitution unused merchandise — commercial interchangeability",
      holding: "Illustrative sample: goods sharing the same 10-digit HTS and meeting interchangeability criteria may be substituted. Confirm against the actual ruling.",
      provisions: ["1313(j)(2)"], status: "active",
      disposition: "Relevant reference — confirm applicability to this claim." },
  ];
  const ADVISORY = {
    adjudication: "How CBP adjudicates real claims is largely not public data. This tool points to published decisions as cautionary examples only — assessing how your claim will fare is your specialist's judgment.",
    discretion: "Some outcomes turn on case-by-case CBP discretion that no rule or dataset can predict. Those are outside this estimate; a specialist and ultimately CBP make the final call.",
  };

  return (
    <div style={{ minHeight: "100vh", background: C.bg, padding: "44px 24px 80px", fontFamily: sans }}>
      <style>{`*{box-sizing:border-box} button:hover{filter:brightness(1.1)}`}</style>

      <div style={{ maxWidth: 620, margin: "0 auto" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 22 }}>
          <div style={{ width: 8, height: 8, borderRadius: 2, background: C.accent }} />
          <span style={{ fontFamily: mono, fontSize: 12.5, letterSpacing: 1, color: C.inkSoft, textTransform: "uppercase" }}>
            Drawback · Recovery Detail
          </span>
        </div>

        {/* headline: the number */}
        <div style={{ display: "flex", alignItems: "baseline", gap: 12, marginBottom: 4 }}>
          <span style={{ fontFamily: sans, fontSize: 15, color: C.inkSoft }}>Estimated recovery for this line</span>
          {data.capped && <span style={{ fontFamily: sans, fontSize: 11, color: C.warn, border: `1px solid ${C.warn}44`, borderRadius: 4, padding: "2px 7px" }}>capped</span>}
        </div>
        <div style={{ fontFamily: mono, fontSize: 36, fontWeight: 600, color: C.ok, letterSpacing: -0.5, marginBottom: 20 }}>
          ${Number(data.refund).toLocaleString("en-US", { minimumFractionDigits: 2 })}
        </div>

        {/* the toggle */}
        <button onClick={() => setOpen((o) => !o)} style={{
          display: "flex", alignItems: "center", gap: 8, background: C.panel,
          border: `1px solid ${C.line}`, borderRadius: 9, padding: "12px 16px",
          width: "100%", cursor: "pointer", textAlign: "left",
        }}>
          <span style={{ fontSize: 12, color: C.accent }}>{open ? "▾" : "▸"}</span>
          <span style={{ fontFamily: sans, fontSize: 14, fontWeight: 500, color: C.ink }}>How it's calculated</span>
          <span style={{ fontFamily: sans, fontSize: 12.5, color: C.inkFaint, marginLeft: "auto" }}>
            {data.steps.filter((s) => s.math).length} steps
          </span>
        </button>

        {open && (
          <div style={{ marginTop: 12, border: `1px solid ${C.line}`, borderRadius: 12, overflow: "hidden", background: C.panel }}>
            {data.steps.map((s, i) => {
              const isFinal = s.math && s.math.startsWith("=");
              return (
                <div key={i} style={{
                  display: "flex", gap: 13, padding: "15px 18px",
                  borderTop: i > 0 ? `1px solid ${C.lineSoft}` : "none",
                  background: isFinal ? C.okBg : "transparent",
                }}>
                  <div style={{
                    width: 22, height: 22, borderRadius: "50%", flexShrink: 0,
                    fontFamily: mono, fontSize: 11, display: "flex", alignItems: "center", justifyContent: "center",
                    background: isFinal ? C.ok : C.panel2, color: isFinal ? C.bg : C.inkSoft,
                    border: isFinal ? "none" : `1px solid ${C.line}`,
                  }}>{isFinal ? "=" : i + 1}</div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontFamily: sans, fontSize: 13.5, color: C.ink, lineHeight: 1.55 }}>{s.text}</div>
                    {s.math && (
                      <div style={{ fontFamily: mono, fontSize: 13, color: isFinal ? C.ok : C.inkSoft, marginTop: 6,
                        background: isFinal ? "transparent" : C.bg, borderRadius: 6,
                        padding: isFinal ? 0 : "6px 10px", display: "inline-block", fontWeight: isFinal ? 600 : 400 }}>
                        {s.math}
                      </div>
                    )}
                    {showLaw && s.basis && (
                      <div style={{ marginTop: 7 }}>
                        <div style={{ fontFamily: sans, fontSize: 12, color: C.accent, display: "flex", gap: 6 }}>
                          <span style={{ flexShrink: 0 }}>§</span><span style={{ lineHeight: 1.5 }}>{s.basis}</span>
                        </div>
                        {s.tier && (
                          <span style={{ display: "inline-block", marginTop: 6, fontFamily: sans, fontSize: 10.5,
                            color: s.tier === "statute" ? C.ok : s.tier === "ruling" ? C.accent : C.warn,
                            border: `1px solid ${(s.tier === "statute" ? C.ok : s.tier === "ruling" ? C.accent : C.warn)}44`,
                            borderRadius: 4, padding: "2px 7px" }}>
                            {s.tier_label} · {s.certainty}
                          </span>
                        )}
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {open && (
          <div style={{ display: "flex", alignItems: "center", gap: 14, marginTop: 14, flexWrap: "wrap" }}>
            <button onClick={() => setShowLaw((l) => !l)} style={{
              background: "none", border: "none", color: C.accent, fontFamily: sans, fontSize: 13, cursor: "pointer", padding: 0,
            }}>{showLaw ? "Hide legal basis" : "Show legal basis for each step"}</button>
            <span style={{ fontFamily: sans, fontSize: 12, color: C.inkFaint }}>
              Every step traces to the statute it comes from.
            </span>
          </div>
        )}

        <div style={{ marginTop: 20 }}>
          <button onClick={() => setShowRulings((r) => !r)} style={{
            display: "flex", alignItems: "center", gap: 8, background: C.panel,
            border: `1px solid ${C.line}`, borderRadius: 9, padding: "12px 16px",
            width: "100%", cursor: "pointer", textAlign: "left",
          }}>
            <span style={{ fontSize: 12, color: C.accent }}>{showRulings ? "▾" : "▸"}</span>
            <span style={{ fontFamily: sans, fontSize: 14, fontWeight: 500, color: C.ink }}>Relevant CBP rulings</span>
            <span style={{ fontFamily: sans, fontSize: 11, color: C.accent, background: C.accentBg, borderRadius: 4, padding: "2px 7px", marginLeft: 8 }}>Ruling tier</span>
            <span style={{ fontFamily: sans, fontSize: 12.5, color: C.inkFaint, marginLeft: "auto" }}>{RULINGS.length}</span>
          </button>

          {showRulings && (
            <div style={{ marginTop: 10 }}>
              {RULINGS.map((r) => (
                <div key={r.ruling_id} style={{ border: `1px solid ${C.line}`, borderRadius: 10, padding: "13px 16px", background: C.panel, marginBottom: 8 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                    <span style={{ fontFamily: mono, fontSize: 12.5, color: C.accent }}>{r.ruling_id}</span>
                    <span style={{ fontFamily: sans, fontSize: 11.5, color: C.inkFaint }}>{r.date}</span>
                    {r.is_sample && <span style={{ fontFamily: sans, fontSize: 10.5, color: C.warn, border: `1px solid ${C.warn}44`, borderRadius: 4, padding: "1px 6px" }}>SAMPLE — replace with live CROSS data</span>}
                  </div>
                  <div style={{ fontFamily: sans, fontSize: 13, color: C.ink, marginTop: 6, fontWeight: 500 }}>{r.issue}</div>
                  <div style={{ fontFamily: sans, fontSize: 12.5, color: C.inkSoft, marginTop: 4, lineHeight: 1.5 }}>{r.holding}</div>
                  <div style={{ fontFamily: sans, fontSize: 12, color: C.warn, marginTop: 8 }}>{r.disposition}</div>
                </div>
              ))}
              <p style={{ fontFamily: sans, fontSize: 12, color: C.inkFaint, margin: "4px 2px 0", lineHeight: 1.55 }}>
                Rulings are relevant references for you to confirm — not determinations, and they don't change the figure above.
              </p>
            </div>
          )}
        </div>

        <div style={{ marginTop: 20, background: C.panel, border: `1px solid ${C.line}`, borderRadius: 10, padding: "15px 17px" }}>
          <div style={{ fontFamily: sans, fontSize: 13, fontWeight: 500, color: C.ink, marginBottom: 8 }}>What this estimate cannot tell you</div>
          <div style={{ fontFamily: sans, fontSize: 12.5, color: C.inkSoft, lineHeight: 1.6, marginBottom: 10 }}>
            <span style={{ color: C.warn }}>Adjudication patterns.</span> {ADVISORY.adjudication}
          </div>
          <div style={{ fontFamily: sans, fontSize: 12.5, color: C.inkSoft, lineHeight: 1.6 }}>
            <span style={{ color: C.warn }}>CBP discretion.</span> {ADVISORY.discretion}
          </div>
        </div>

        <div style={{ marginTop: 20, borderTop: `1px solid ${C.lineSoft}`, paddingTop: 16 }}>
          <div style={{ fontFamily: sans, fontSize: 12.5, fontWeight: 500, color: C.inkSoft, marginBottom: 6 }}>
            What this estimate is based on
          </div>
          <p style={{ fontFamily: sans, fontSize: 12, color: C.inkFaint, margin: "0 0 8px", lineHeight: 1.6 }}>
            Every step above rests on drawback law as written in statute and regulation
            (shown as <span style={{ color: C.ok }}>Firmly codified</span>). It does not
            yet incorporate CBP rulings or practice patterns, and it cannot account for
            case-by-case CBP discretion.
          </p>
          <p style={{ fontFamily: sans, fontSize: 12, color: C.inkFaint, margin: 0, lineHeight: 1.6 }}>
            This is an estimate showing how the figure is derived, not a filing. A licensed
            drawback specialist — and ultimately CBP — make the final determination.
          </p>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(HowItsCalculated));
</script></body></html>
