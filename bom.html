<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Drawback — Bill of Materials</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#10110F}</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head><body><div id="root"></div><script type="text/babel" data-presets="react">
const { useState } = React;

// ─────────────────────────────────────────────────────────────────────────
// Duty Drawback — Bill of Materials (manufacturing drawback)
//
// Manufacturing drawback needs something no uploaded document contains: which
// imported inputs went into the exported article, in what quantities, with what
// yield. That's the manufacturer's own production knowledge. So this is a
// structured DATA-ENTRY form, not a calculation — the user supplies the numbers,
// we collect them and feed the engine. We do not compute, infer, or second-guess
// the BOM; the engine builds designations from exactly what's entered.
//
// Feeds POST /api/manufacturing/estimate, which returns the designations and
// estimated recovery. Import entry/line references come from the claim's already-
// uploaded 7501s (here, a small picker of loaded entries).
// ─────────────────────────────────────────────────────────────────────────

const C = {
  bg: "#10110F", panel: "#181A17", panel2: "#1F221D", line: "#2C302A",
  lineSoft: "#23261F", ink: "#EDEFE9", inkSoft: "#A7AC9E", inkFaint: "#6E7567",
  ok: "#7FB069", okBg: "#1A2417", accent: "#6BA8C9", accentBg: "#13202722",
  warn: "#D8A24A", err: "#C16E5A",
};
const mono = "'JetBrains Mono','SF Mono',ui-monospace,monospace";
const sans = "'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";

// Import entries already loaded in the claim (from uploaded 7501s).
const LOADED_ENTRIES = [
  { entry: "ENT-1001", line: 1, desc: "Laptop computer · 8471.30.0100 · 1,000 EA" },
  { entry: "ENT-1002", line: 1, desc: "Display panel · 8528.52.0000 · 4,000 EA" },
  { entry: "ENT-1002", line: 2, desc: "Battery cell · 8507.60.0020 · 8,000 EA" },
];

let _rowId = 1;
const newRow = () => ({
  id: _rowId++, entryKey: "", quantity_per_unit: "", yield_factor: "1",
});

function BomEntry({ onEstimate }) {
  const [articleId, setArticleId] = useState("");
  const [qtyExported, setQtyExported] = useState("");
  const [rows, setRows] = useState([newRow()]);
  const [result, setResult] = useState(null);

  const setRow = (id, patch) =>
    setRows((rs) => rs.map((r) => (r.id === id ? { ...r, ...patch } : r)));
  const addRow = () => setRows((rs) => [...rs, newRow()]);
  const removeRow = (id) => setRows((rs) => (rs.length > 1 ? rs.filter((r) => r.id !== id) : rs));

  const complete =
    articleId.trim() && qtyExported.trim() &&
    rows.every((r) => r.entryKey && r.quantity_per_unit.trim() && r.yield_factor.trim());

  const submit = () => {
    // shape exactly matches POST /api/manufacturing/estimate
    const components = rows.map((r) => {
      const [entry, line] = r.entryKey.split("|");
      return {
        import_entry_number: entry, import_line_number: Number(line),
        quantity_per_unit: r.quantity_per_unit, yield_factor: r.yield_factor || "1",
      };
    });
    const payload = { article_id: articleId, quantity_exported: qtyExported, components };
    if (onEstimate) { onEstimate(payload); return; }
    // local preview: mirror the engine's arithmetic (qty * per_unit / yield)
    const designations = components.map((c) => ({
      entry_number: c.import_entry_number, import_line: c.import_line_number,
      input_units_needed: String(
        (Number(qtyExported) * Number(c.quantity_per_unit)) / Number(c.yield_factor || 1)
      ),
    }));
    setResult({ designations, note: "Preview — submit to the engine for the recovery figure." });
  };

  return (
    <div style={{ minHeight: "100vh", background: C.bg, padding: "44px 24px 80px", fontFamily: sans }}>
      <style>{`*{box-sizing:border-box} button:hover:not(:disabled){filter:brightness(1.08)}
        input:focus,select:focus{border-color:${C.accent}!important;outline:none}
        ::placeholder{color:${C.inkFaint}}`}</style>

      <div style={{ maxWidth: 700, margin: "0 auto" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 22 }}>
          <div style={{ width: 8, height: 8, borderRadius: 2, background: C.warn }} />
          <span style={{ fontFamily: mono, fontSize: 12.5, letterSpacing: 1, color: C.inkSoft, textTransform: "uppercase" }}>
            Drawback · Bill of Materials
          </span>
        </div>

        <h1 style={{ fontFamily: sans, fontSize: 22, fontWeight: 600, color: C.ink, margin: "0 0 4px" }}>
          What went into the exported article?
        </h1>
        <p style={{ fontFamily: sans, fontSize: 14, color: C.inkSoft, margin: "0 0 8px", lineHeight: 1.6 }}>
          Manufacturing drawback needs your production data: which imported inputs were
          consumed making the exported article, and in what quantities. This isn't on your
          import or export documents — only you have it.
        </p>
        <p style={{ fontFamily: sans, fontSize: 12.5, color: C.inkFaint, margin: "0 0 24px", lineHeight: 1.6 }}>
          We use exactly the numbers you enter — we don't estimate or adjust your bill of materials.
        </p>

        {/* Finished article */}
        <div style={{ display: "flex", gap: 12, marginBottom: 22 }}>
          <div style={{ flex: 2 }}>
            <label style={lbl}>Exported article</label>
            <input value={articleId} onChange={(e) => setArticleId(e.target.value)}
              placeholder="e.g. Finished laptop assembly" style={inp} />
          </div>
          <div style={{ flex: 1 }}>
            <label style={lbl}>Quantity exported</label>
            <input value={qtyExported} onChange={(e) => setQtyExported(e.target.value.replace(/[^0-9.]/g, ""))}
              placeholder="e.g. 500" style={{ ...inp, fontFamily: mono }} />
          </div>
        </div>

        {/* Components */}
        <div style={{ fontFamily: sans, fontSize: 14, fontWeight: 600, color: C.ink, marginBottom: 4 }}>
          Imported inputs consumed
        </div>
        <p style={{ fontFamily: sans, fontSize: 12.5, color: C.inkFaint, margin: "0 0 12px", lineHeight: 1.5 }}>
          For each imported input: how many units go into <i>one</i> finished article, and the
          yield (1 = no loss; 0.95 = 5% waste).
        </p>

        <div style={{ border: `1px solid ${C.line}`, borderRadius: 12, overflow: "hidden", background: C.panel }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 120px 90px 36px", gap: 10, padding: "10px 14px", background: C.panel2, fontFamily: sans, fontSize: 11.5, color: C.inkFaint, textTransform: "uppercase", letterSpacing: 0.3 }}>
            <div>Imported input (from your 7501s)</div>
            <div>Units per article</div>
            <div>Yield</div>
            <div />
          </div>
          {rows.map((r, i) => (
            <div key={r.id} style={{ display: "grid", gridTemplateColumns: "1fr 120px 90px 36px", gap: 10, padding: "11px 14px", alignItems: "center", borderTop: `1px solid ${C.lineSoft}` }}>
              <select value={r.entryKey} onChange={(e) => setRow(r.id, { entryKey: e.target.value })} style={{ ...inp, height: 34 }}>
                <option value="">Select an imported input…</option>
                {LOADED_ENTRIES.map((e) => (
                  <option key={`${e.entry}|${e.line}`} value={`${e.entry}|${e.line}`}>{e.desc}</option>
                ))}
              </select>
              <input value={r.quantity_per_unit} onChange={(e) => setRow(r.id, { quantity_per_unit: e.target.value.replace(/[^0-9.]/g, "") })}
                placeholder="e.g. 2" style={{ ...inp, height: 34, fontFamily: mono }} />
              <input value={r.yield_factor} onChange={(e) => setRow(r.id, { yield_factor: e.target.value.replace(/[^0-9.]/g, "") })}
                style={{ ...inp, height: 34, fontFamily: mono }} />
              <button onClick={() => removeRow(r.id)} aria-label="Remove input" style={{ background: "none", border: "none", color: C.inkFaint, cursor: "pointer", fontSize: 17 }}>×</button>
            </div>
          ))}
        </div>

        <button onClick={addRow} style={{ background: "none", border: "none", color: C.accent, fontFamily: sans, fontSize: 13, cursor: "pointer", padding: "10px 2px 0" }}>
          + Add another imported input
        </button>

        <div style={{ marginTop: 22 }}>
          <button onClick={submit} disabled={!complete} style={{
            fontFamily: sans, fontSize: 13.5, fontWeight: 500,
            color: complete ? C.bg : C.inkFaint, background: complete ? C.warn : C.panel2,
            border: "none", borderRadius: 8, padding: "11px 20px", cursor: complete ? "pointer" : "default",
          }}>Estimate manufacturing recovery →</button>
          {!complete && (
            <span style={{ fontFamily: sans, fontSize: 12.5, color: C.inkFaint, marginLeft: 12 }}>
              Fill in the article, quantity, and each input row.
            </span>
          )}
        </div>

        {result && (
          <div style={{ marginTop: 22, border: `1px solid ${C.line}`, borderRadius: 12, background: C.panel, padding: "16px 18px" }}>
            <div style={{ fontFamily: sans, fontSize: 13, fontWeight: 600, color: C.ink, marginBottom: 10 }}>Input units the engine will designate</div>
            {result.designations.map((d, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", fontFamily: mono, fontSize: 13, color: C.inkSoft, padding: "6px 0", borderTop: i > 0 ? `1px solid ${C.lineSoft}` : "none" }}>
                <span>{d.entry_number} · line {d.import_line}</span>
                <span style={{ color: C.ink }}>{d.input_units_needed} units</span>
              </div>
            ))}
            <p style={{ fontFamily: sans, fontSize: 12, color: C.inkFaint, marginTop: 10, lineHeight: 1.55 }}>{result.note}</p>
          </div>
        )}

        <p style={{ fontFamily: sans, fontSize: 12, color: C.inkFaint, marginTop: 24, lineHeight: 1.6, borderTop: `1px solid ${C.lineSoft}`, paddingTop: 16 }}>
          Recovery is computed from the bill of materials you supply. We don't verify your
          inputs or yields — their accuracy is yours to confirm. Manufacturing drawback edge
          cases (multi-input apportionment, yield treatment) should be reviewed by a licensed
          specialist. Estimate, not a filing.
        </p>
      </div>
    </div>
  );
}

const lbl = { display: "block", fontFamily: "'Inter',sans-serif", fontSize: 12.5, fontWeight: 500, color: "#A7AC9E", marginBottom: 6 };
const inp = {
  width: "100%", boxSizing: "border-box", height: 38, padding: "0 12px",
  fontFamily: "'Inter',sans-serif", fontSize: 13.5, color: "#EDEFE9",
  background: "#1F221D", border: "1px solid #2C302A", borderRadius: 7,
};

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(BomEntry));
</script></body></html>
