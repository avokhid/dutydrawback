<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duty Drawback — Recovery Estimate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#10110F}</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

// ─────────────────────────────────────────────────────────────────────────
// Duty Drawback — Recovery Estimate (customer-facing)
//
// The estimator's hero deliverable. Unlike the internal reviewer console, this
// is shown to a PROSPECT deciding whether to engage. Its job: make the recovery
// number feel substantial AND credible. The design risk taken here is honesty —
// the confidence band and the caveats are foregrounded, not buried, because an
// estimate oversold is trust destroyed. A confident range beats a fake-precise
// single number.
//
// Reads the same shapes the engine produces: ClaimCalculation.total_refund and
// per-line LineCalculation (refund, cap_applied, per-unit basis), plus a match
// confidence tier so high- vs lower-confidence recovery is shown separately.
//
// Wire: replace ESTIMATE with GET /api/claim/estimate (a summary endpoint that
// runs calculate_claim over auto-pass matches for the firm number and includes
// review-tier as the "additional potential" band).
// ─────────────────────────────────────────────────────────────────────────

const C = {
  bg: "#10110F", panel: "#181A17", panel2: "#1F221D", line: "#2C302A",
  lineSoft: "#23261F", ink: "#EDEFE9", inkSoft: "#A7AC9E", inkFaint: "#6E7567",
  pass: "#7FB069", passBg: "#1A2417", review: "#D8A24A", reviewBg: "#241E12",
  accent: "#6BA8C9", accentBg: "#13202722",
};
const mono = "'JetBrains Mono','SF Mono',ui-monospace,monospace";
const sans = "'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";

// ── Sample estimate (replace with /api/claim/estimate) ──────────────────────

const ESTIMATE = {
  firm: "Acme Imports LLC",
  period: "Jan 2024 – Jun 2026",
  // high-confidence recovery (auto-pass matches): the number we stand behind
  confident: 48720.0,
  // additional potential (review-tier matches): real but needs verification
  potential: 31450.0,
  entriesAnalyzed: 312,
  matchedLines: 187,
  drawbackType: "Unused merchandise (substitution)",
  lines: [
    { hts: "8471.30.0100", desc: "Laptop computers", duties: 21800, refund: 18450, capped: false, conf: "high" },
    { hts: "8544.42.9090", desc: "USB-C cables", duties: 9400, refund: 9306, capped: false, conf: "high" },
    { hts: "8504.40.9510", desc: "Power adapters", duties: 12300, refund: 11200, capped: true, conf: "high" },
    { hts: "8471.60.2000", desc: "Input peripherals", duties: 10600, refund: 9764, capped: false, conf: "high" },
    { hts: "4202.92.9100", desc: "Cases & sleeves", duties: 18900, refund: 16800, capped: true, conf: "review" },
    { hts: "8473.30.5100", desc: "Parts & accessories", duties: 16200, refund: 14650, capped: false, conf: "review" },
  ],
};

const fmt = (n) => "$" + Math.round(n).toLocaleString("en-US");
const fmtK = (n) => "$" + (n / 1000).toFixed(1) + "K";

// ── Component ────────────────────────────────────────────────────────────

function EstimateReport() {
  const [showLines, setShowLines] = useState(true);
  const e = ESTIMATE;

  const low = e.confident;
  const high = e.confident + e.potential;
  const confidentPctOfRange = Math.round((low / high) * 100);

  const confidentLines = e.lines.filter((l) => l.conf === "high");
  const reviewLines = e.lines.filter((l) => l.conf === "review");

  return (
    <div style={{ minHeight: "100vh", background: C.bg, padding: "44px 24px 90px", fontFamily: sans }}>
      <style>{`
        * { box-sizing: border-box; }
        button:hover:not(:disabled){ filter:brightness(1.08); }
        @media (prefers-reduced-motion: reduce){ * { transition:none !important; } }
      `}</style>

      <div style={{ maxWidth: 820, margin: "0 auto" }}>
        {/* eyebrow */}
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 28 }}>
          <div style={{ width: 8, height: 8, borderRadius: 2, background: C.pass }} />
          <span style={{ fontFamily: mono, fontSize: 12.5, letterSpacing: 1, color: C.inkSoft, textTransform: "uppercase" }}>
            Drawback · Recovery Estimate
          </span>
        </div>

        {/* hero: the number, as a credible range */}
        <div style={{ marginBottom: 6, fontFamily: sans, fontSize: 15, color: C.inkSoft }}>
          {e.firm} · {e.period}
        </div>
        <h1 style={{ fontFamily: sans, fontSize: 19, fontWeight: 500, color: C.inkSoft, margin: "0 0 14px", letterSpacing: -0.2 }}>
          Estimated duty recovery
        </h1>

        <div style={{ display: "flex", alignItems: "baseline", gap: 14, flexWrap: "wrap" }}>
          <span style={{ fontFamily: mono, fontSize: 52, fontWeight: 600, color: C.ink, letterSpacing: -1, lineHeight: 1 }}>
            {fmt(low)}
          </span>
          <span style={{ fontFamily: sans, fontSize: 22, color: C.inkFaint }}>–</span>
          <span style={{ fontFamily: mono, fontSize: 52, fontWeight: 600, color: C.pass, letterSpacing: -1, lineHeight: 1 }}>
            {fmt(high)}
          </span>
        </div>
        <p style={{ fontFamily: sans, fontSize: 14, color: C.inkSoft, margin: "14px 0 28px", lineHeight: 1.6, maxWidth: 620 }}>
          The lower figure is what we'd stand behind today from clearly-matched
          shipments. The upper figure adds recovery from matches that need
          verification — real, but not yet confirmed. This is an estimate, not a
          filing; final recovery depends on documentation review.
        </p>

        {/* confidence band bar */}
        <div style={{ marginBottom: 32 }}>
          <div style={{ display: "flex", height: 12, borderRadius: 6, overflow: "hidden", border: `1px solid ${C.line}` }}>
            <div style={{ width: `${confidentPctOfRange}%`, background: C.pass }} />
            <div style={{ flex: 1, background: C.review, opacity: 0.55 }} />
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, fontFamily: sans, fontSize: 12.5 }}>
            <span style={{ color: C.pass }}>■ {fmt(low)} high-confidence</span>
            <span style={{ color: C.review }}>■ {fmt(e.potential)} additional potential</span>
          </div>
        </div>

        {/* basis stats */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 12, marginBottom: 32 }}>
          <Metric label="Entries analyzed" value={e.entriesAnalyzed} />
          <Metric label="Lines matched" value={e.matchedLines} />
          <Metric label="Recovery rate" value="99%" sub="of duties/fees" />
          <Metric label="Drawback basis" value="Unused" sub="substitution" small />
        </div>

        {/* breakdown */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
          <h2 style={{ fontFamily: sans, fontSize: 16, fontWeight: 600, color: C.ink, margin: 0 }}>
            Recovery by product category
          </h2>
          <button onClick={() => setShowLines((s) => !s)} style={{ background: "none", border: "none", color: C.accent, fontFamily: sans, fontSize: 12.5, cursor: "pointer" }}>
            {showLines ? "Hide detail" : "Show detail"}
          </button>
        </div>

        {showLines && (
          <div style={{ border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden", marginBottom: 8 }}>
            <Row header cells={["HTS / category", "Duties paid", "Est. recovery", ""]} />
            {confidentLines.map((l, i) => <LineRow key={i} l={l} />)}
            {reviewLines.length > 0 && (
              <div style={{ padding: "8px 16px", background: C.reviewBg, fontFamily: sans, fontSize: 11.5, color: C.review, letterSpacing: 0.3, textTransform: "uppercase", borderTop: `1px solid ${C.lineSoft}` }}>
                Additional potential — needs verification
              </div>
            )}
            {reviewLines.map((l, i) => <LineRow key={`r${i}`} l={l} muted />)}
          </div>
        )}

        <p style={{ fontFamily: sans, fontSize: 12.5, color: C.inkFaint, margin: "12px 0 32px", lineHeight: 1.6 }}>
          "Capped" lines reflect the substitution lesser-of rule, where recovery
          is limited to the lower of the imported or exported article's duty. All
          figures are estimates pending documentation review and confirmation by a
          licensed drawback specialist.
        </p>

        {/* CTA — the estimator's whole point is to start a conversation */}
        <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderLeft: `3px solid ${C.pass}`, borderRadius: 10, padding: "20px 22px", display: "flex", alignItems: "center", gap: 20, flexWrap: "wrap" }}>
          <div style={{ flex: 1, minWidth: 240 }}>
            <div style={{ fontFamily: sans, fontSize: 15, fontWeight: 600, color: C.ink, marginBottom: 4 }}>
              Turn this estimate into a recovered refund
            </div>
            <div style={{ fontFamily: sans, fontSize: 13, color: C.inkSoft, lineHeight: 1.55 }}>
              A specialist reviews your documentation, confirms the matches, and
              prepares the claim. You pay only on what's actually recovered.
            </div>
          </div>
          <button style={{ fontFamily: sans, fontSize: 14, fontWeight: 500, color: C.bg, background: C.pass, border: "none", borderRadius: 8, padding: "11px 22px", cursor: "pointer", whiteSpace: "nowrap" }}>
            Start a claim review
          </button>
        </div>

        <div style={{ marginTop: 20, fontFamily: sans, fontSize: 11.5, color: C.inkFaint, lineHeight: 1.6 }}>
          Estimate generated from the import and export records provided. Not legal
          or customs advice. Duty drawback is governed by 19 U.S.C. 1313 and 19 CFR
          Part 190; eligibility and final amounts are determined by U.S. Customs and
          Border Protection.
        </div>
      </div>
    </div>
  );
}

function Metric({ label, value, sub, small }) {
  return (
    <div style={{ background: C.panel2, borderRadius: 9, padding: "13px 14px" }}>
      <div style={{ fontFamily: mono, fontSize: small ? 18 : 22, fontWeight: 600, color: C.ink, lineHeight: 1.1 }}>{value}</div>
      <div style={{ fontFamily: sans, fontSize: 11.5, color: C.inkSoft, marginTop: 4 }}>{label}{sub && <span style={{ color: C.inkFaint }}> · {sub}</span>}</div>
    </div>
  );
}

const cells4 = { display: "grid", gridTemplateColumns: "1fr 130px 130px 70px", columnGap: 12, alignItems: "center" };

function Row({ header, cells }) {
  return (
    <div style={{ ...cells4, padding: "10px 16px", background: C.panel2, fontFamily: sans, fontSize: 11.5, color: C.inkFaint, fontWeight: 500, textTransform: "uppercase", letterSpacing: 0.3 }}>
      <div>{cells[0]}</div>
      <div style={{ textAlign: "right" }}>{cells[1]}</div>
      <div style={{ textAlign: "right" }}>{cells[2]}</div>
      <div style={{ textAlign: "right" }}>{cells[3]}</div>
    </div>
  );
}

function LineRow({ l, muted }) {
  return (
    <div style={{ ...cells4, padding: "12px 16px", borderTop: `1px solid ${C.lineSoft}`, opacity: muted ? 0.7 : 1 }}>
      <div>
        <span style={{ fontFamily: mono, fontSize: 12.5, color: C.ink }}>{l.hts}</span>
        <div style={{ fontFamily: sans, fontSize: 12.5, color: C.inkSoft, marginTop: 2 }}>{l.desc}</div>
      </div>
      <div style={{ textAlign: "right", fontFamily: mono, fontSize: 13, color: C.inkSoft }}>{fmt(l.duties)}</div>
      <div style={{ textAlign: "right", fontFamily: mono, fontSize: 13, fontWeight: 600, color: muted ? C.review : C.pass }}>{fmt(l.refund)}</div>
      <div style={{ textAlign: "right" }}>
        {l.capped && <span style={{ fontFamily: sans, fontSize: 10.5, color: C.inkFaint, border: `1px solid ${C.line}`, borderRadius: 4, padding: "2px 6px" }}>capped</span>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(EstimateReport));
</script></body></html>
