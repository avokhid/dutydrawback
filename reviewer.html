<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duty Drawback — Match Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#10110F}</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useCallback, useRef } = React;

// ─────────────────────────────────────────────────────────────────────────
// Duty Drawback — Match Reviewer
//
// A working prototype of the reviewer console from SPEC_reviewer_ui.md.
// Three connected views over shared state:
//   1. Queue overview  — the triage dashboard (auto-pass vs review counts)
//   2. Bulk approve     — dense high-confidence list, clear in one action
//   3. Single review    — one uncertain match, uncertain field flagged, proof inline
//   4. Correction form   — structured capture that becomes a reusable rule
//
// The design treats this as an instrument, not a page: dense but calm, with
// color reserved for encoding confidence/uncertainty, and the reviewer's eye
// engineered toward the single field in question. Keyboard-first.
//
// Sample data stands in for the backend (matching.CandidateMatch, validation
// Findings, etc). Replace the SAMPLE_* seeds + the action handlers with real
// API calls per the spec's backend contract.
// ─────────────────────────────────────────────────────────────────────────

const C = {
  bg: "#10110F",
  panel: "#181A17",
  panel2: "#1F221D",
  line: "#2C302A",
  lineSoft: "#23261F",
  ink: "#EDEFE9",
  inkSoft: "#A7AC9E",
  inkFaint: "#6E7567",
  // semantic — muted, instrument-like, not neon
  pass: "#7FB069",       // confident green
  passBg: "#1A2417",
  review: "#D8A24A",     // amber, the "look here" color
  reviewBg: "#241E12",
  reject: "#C16E5A",     // muted clay for problems
  rejectBg: "#241813",
  accent: "#6BA8C9",     // cool blue for structure/links
  accentBg: "#13202733",
};

const mono = "'SF Mono','JetBrains Mono','Fira Code',ui-monospace,monospace";
const sans = "'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";

// ── Sample data ────────────────────────────────────────────────────────────

const HIGH_CONF = [
  { id: "m1", imp: "WIDGET-A laptop", impHts: "8471.30.0100", impQty: "500 EA", exp: "Laptop unit", expHts: "8471.30.0100", expQty: "500 EA", conf: 0.99 },
  { id: "m2", imp: "CABLE-USB-C", impHts: "8544.42.9090", impQty: "2,000 EA", exp: "USB-C cable", expHts: "8544.42.9090", expQty: "2,000 EA", conf: 0.98 },
  { id: "m3", imp: "ADPT-65W", impHts: "8504.40.9510", impQty: "800 EA", exp: "65W adapter", expHts: "8504.40.9510", expQty: "800 EA", conf: 0.97 },
  { id: "m4", imp: "WIDGET-B tablet", impHts: "8471.30.0100", impQty: "350 EA", exp: "Tablet unit", expHts: "8471.30.0100", expQty: "350 EA", conf: 0.96 },
  { id: "m5", imp: "CASE-13IN", impHts: "4202.92.9100", impQty: "1,200 EA", exp: "13in sleeve", expHts: "4202.92.9100", expQty: "1,200 EA", conf: 0.96 },
  { id: "m6", imp: "MOUSE-WL", impHts: "8471.60.2000", impQty: "1,500 EA", exp: "Wireless mouse", expHts: "8471.60.2000", expQty: "1,500 EA", conf: 0.95 },
];

const REVIEW_QUEUE = [
  {
    id: "r1", vendor: "ACME-MFG", part: "WIDGET-A", conf: 0.76,
    uncertain: "uom",
    fields: {
      hts: { label: "HTS", imp: "8471.30.0100", exp: "8471.30.0100", ok: true },
      desc: { label: "Description", imp: "WIDGET-A laptop unit", exp: "Laptop assembly, blue", ok: true },
      qty: { label: "Quantity / unit", imp: "500 cartons", exp: "6,000 units", ok: false },
      value: { label: "Value", imp: "$124,000", exp: "$131,400", ok: true },
      date: { label: "Date", imp: "2024-03-11", exp: "2025-09-02", ok: true, note: "within 5yr" },
    },
    suggestion: { text: "1 carton = 12 units", detail: "500 cartons = 6,000 units" },
    proof: { source: "7501 line 4, page 2", line: "04  8471.30.0100  500 CTN  ENTERED VAL 124,000", highlight: "500 CTN" },
  },
  {
    id: "r2", vendor: "GLOBEX", part: "ADPT-90W", conf: 0.68,
    uncertain: "desc",
    fields: {
      hts: { label: "HTS", imp: "8504.40.9510", exp: "8504.40.9510", ok: true },
      desc: { label: "Description", imp: "ADPT-90W power supply", exp: "AC adapter, generic", ok: false },
      qty: { label: "Quantity / unit", imp: "300 EA", exp: "300 EA", ok: true },
      value: { label: "Value", imp: "$18,000", exp: "$17,400", ok: true },
      date: { label: "Date", imp: "2024-06-02", exp: "2025-11-15", ok: true, note: "within 5yr" },
    },
    suggestion: { text: "Likely same item", detail: "HTS + quantity match; descriptions differ in wording" },
    proof: { source: "7501 line 2, page 1", line: "02  8504.40.9510  300 EA  ADPT-90W POWER SUPPLY", highlight: "ADPT-90W POWER SUPPLY" },
  },
  {
    id: "r3", vendor: "INITECH", part: "CASE-15IN", conf: 0.58,
    uncertain: "date",
    fields: {
      hts: { label: "HTS", imp: "4202.92.9100", exp: "4202.92.9100", ok: true },
      desc: { label: "Description", imp: "CASE-15IN sleeve", exp: "15in laptop sleeve", ok: true },
      qty: { label: "Quantity / unit", imp: "900 EA", exp: "900 EA", ok: true },
      value: { label: "Value", imp: "$9,000", exp: "$9,450", ok: true },
      date: { label: "Date", imp: "2020-01-08", exp: "2025-02-01", ok: false, note: "near 5yr limit" },
    },
    suggestion: { text: "Verify eligibility window", detail: "Export is 5yr 24d after import — outside the window unless tolled" },
    proof: { source: "7501 line 1, page 1", line: "01  4202.92.9100  900 EA  IMPORT DATE 2020-01-08", highlight: "2020-01-08" },
  },
];

const REASON_CODES = [
  "Vendor pack configuration differs from default",
  "Conversion factor wrong in source data",
  "Partial shipment / split carton",
  "Re-measured against commercial invoice",
  "Confirmed same item",
  "Other (specify in note)",
];

const FIELD_OPTIONS = [
  "Quantity / unit of measure",
  "HTS classification",
  "Entered value",
  "Date / eligibility window",
  "Item identity (not the same product)",
];

// ── Small UI atoms ───────────────────────────────────────────────────────

function Pill({ children, color, bg }) {
  return (
    <span style={{
      fontFamily: mono, fontSize: 11, letterSpacing: 0.3, padding: "3px 8px",
      borderRadius: 5, color, background: bg, whiteSpace: "nowrap",
      border: `1px solid ${color}33`,
    }}>{children}</span>
  );
}

function confColor(c) {
  if (c >= 0.9) return C.pass;
  if (c >= 0.5) return C.review;
  return C.reject;
}

function Key({ children }) {
  return (
    <kbd style={{
      fontFamily: mono, fontSize: 10, padding: "2px 6px", borderRadius: 4,
      background: C.panel2, border: `1px solid ${C.line}`, color: C.inkSoft,
      marginLeft: 6, lineHeight: 1.4,
    }}>{children}</kbd>
  );
}

// ── View: Queue overview ───────────────────────────────────────────────────

function Overview({ stats, onGoBulk, onGoReview }) {
  const total = stats.autoPass + stats.review + stats.approved + stats.rejected;
  const pct = total ? Math.round((stats.approved / total) * 100) : 0;
  return (
    <div style={{ maxWidth: 760, margin: "0 auto" }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: 12, marginBottom: 4 }}>
        <h1 style={{ fontFamily: sans, fontSize: 26, fontWeight: 600, margin: 0, color: C.ink, letterSpacing: -0.3 }}>
          Claim DBK-2291
        </h1>
        <span style={{ fontFamily: mono, fontSize: 13, color: C.inkFaint }}>Acme Imports LLC</span>
      </div>
      <p style={{ fontFamily: sans, fontSize: 14, color: C.inkSoft, margin: "0 0 28px", lineHeight: 1.6 }}>
        {total} proposed matches. The engine cleared the confident ones; your attention goes only to what it couldn't resolve.
      </p>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 28 }}>
        <button onClick={onGoBulk} style={cardBtn(C.pass)}>
          <div style={{ fontFamily: mono, fontSize: 40, fontWeight: 600, color: C.pass, lineHeight: 1 }}>
            {stats.autoPass}
          </div>
          <div style={{ fontFamily: sans, fontSize: 14, color: C.ink, marginTop: 8, fontWeight: 500 }}>
            High confidence — ready to approve
          </div>
          <div style={{ fontFamily: sans, fontSize: 12.5, color: C.inkSoft, marginTop: 4 }}>
            Clear the whole batch in one action →
          </div>
        </button>
        <button onClick={onGoReview} style={cardBtn(C.review)}>
          <div style={{ fontFamily: mono, fontSize: 40, fontWeight: 600, color: C.review, lineHeight: 1 }}>
            {stats.review}
          </div>
          <div style={{ fontFamily: sans, fontSize: 14, color: C.ink, marginTop: 8, fontWeight: 500 }}>
            Needs your review
          </div>
          <div style={{ fontFamily: sans, fontSize: 12.5, color: C.inkSoft, marginTop: 4 }}>
            One uncertain field each — confirm or correct →
          </div>
        </button>
      </div>

      <div style={{ display: "flex", gap: 24, padding: "16px 20px", background: C.panel, border: `1px solid ${C.line}`, borderRadius: 10 }}>
        <Stat label="Approved" value={stats.approved} color={C.pass} />
        <Stat label="Rejected" value={stats.rejected} color={C.reject} />
        <Stat label="Remaining" value={stats.autoPass + stats.review} color={C.ink} />
        <div style={{ marginLeft: "auto", textAlign: "right" }}>
          <div style={{ fontFamily: mono, fontSize: 22, fontWeight: 600, color: C.accent }}>{pct}%</div>
          <div style={{ fontFamily: sans, fontSize: 12, color: C.inkSoft }}>claim complete</div>
        </div>
      </div>
    </div>
  );
}

function Stat({ label, value, color }) {
  return (
    <div>
      <div style={{ fontFamily: mono, fontSize: 22, fontWeight: 600, color }}>{value}</div>
      <div style={{ fontFamily: sans, fontSize: 12, color: C.inkSoft }}>{label}</div>
    </div>
  );
}

function cardBtn(accent) {
  return {
    textAlign: "left", cursor: "pointer", background: C.panel,
    border: `1px solid ${C.line}`, borderLeft: `3px solid ${accent}`,
    borderRadius: 10, padding: "22px 22px 20px", transition: "background .15s",
  };
}

// ── View: Bulk approve ─────────────────────────────────────────────────────

function BulkApprove({ rows, onApprove, onSendToReview, onBack }) {
  const [checked, setChecked] = useState(() => Object.fromEntries(rows.map(r => [r.id, true])));
  const selCount = Object.values(checked).filter(Boolean).length;
  const allSel = selCount === rows.length;

  const toggleAll = () => {
    const v = !allSel;
    setChecked(Object.fromEntries(rows.map(r => [r.id, v])));
  };

  useEffect(() => {
    const h = (e) => {
      if (e.key === "Enter" && selCount > 0) { e.preventDefault(); onApprove(rows.filter(r => checked[r.id]).map(r => r.id)); }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [checked, selCount, rows, onApprove]);

  return (
    <div style={{ maxWidth: 860, margin: "0 auto" }}>
      <ViewHeader onBack={onBack} title="High-confidence queue" sub={`${rows.length} matches at ≥95% confidence`} accent={C.pass} />

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", margin: "0 0 12px" }}>
        <label style={{ display: "flex", alignItems: "center", gap: 9, cursor: "pointer", fontFamily: sans, fontSize: 13, color: C.inkSoft }}>
          <input type="checkbox" checked={allSel} onChange={toggleAll} style={cbStyle} />
          {selCount} of {rows.length} selected
        </label>
        <span style={{ fontFamily: sans, fontSize: 12.5, color: C.inkFaint }}>Deselect anything that looks off — it routes to review</span>
      </div>

      <div style={{ border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden" }}>
        <div style={{ ...rowGrid, background: C.panel2, padding: "10px 14px", fontFamily: sans, fontSize: 11.5, color: C.inkFaint, fontWeight: 500, letterSpacing: 0.3, textTransform: "uppercase" }}>
          <div /><div>Import line</div><div>Matched export</div><div style={{ textAlign: "right" }}>Conf.</div>
        </div>
        {rows.map((r, i) => (
          <div key={r.id} style={{ ...rowGrid, padding: "11px 14px", alignItems: "center", borderTop: `1px solid ${C.lineSoft}`, background: checked[r.id] ? "transparent" : C.bg, opacity: checked[r.id] ? 1 : 0.42, transition: "opacity .12s" }}>
            <input type="checkbox" checked={!!checked[r.id]} onChange={() => setChecked(s => ({ ...s, [r.id]: !s[r.id] }))} style={cbStyle} />
            <div style={{ fontFamily: mono, fontSize: 12.5, color: C.ink }}>
              {r.imp}<div style={{ color: C.inkFaint, fontSize: 11, marginTop: 2 }}>{r.impHts} · {r.impQty}</div>
            </div>
            <div style={{ fontFamily: mono, fontSize: 12.5, color: C.ink }}>
              {r.exp} <span style={{ color: C.pass }}>✓</span>
              <div style={{ color: C.inkFaint, fontSize: 11, marginTop: 2 }}>{r.expHts} · {r.expQty}</div>
            </div>
            <div style={{ textAlign: "right", fontFamily: mono, fontSize: 13, fontWeight: 600, color: confColor(r.conf) }}>
              {Math.round(r.conf * 100)}%
            </div>
          </div>
        ))}
      </div>

      <div style={{ display: "flex", gap: 10, marginTop: 16, alignItems: "center" }}>
        <button onClick={() => onApprove(rows.filter(r => checked[r.id]).map(r => r.id))} disabled={!selCount} style={primaryBtn(C.pass, !selCount)}>
          Approve selected ({selCount}) <Key>⏎</Key>
        </button>
        <button onClick={() => onSendToReview(rows.filter(r => !checked[r.id]).map(r => r.id))} disabled={selCount === rows.length} style={ghostBtn(selCount === rows.length)}>
          Send unchecked to review
        </button>
      </div>
    </div>
  );
}

const rowGrid = { display: "grid", gridTemplateColumns: "28px 1fr 1fr 64px", gap: 0, columnGap: 12 };
const cbStyle = { width: 16, height: 16, accentColor: C.pass, cursor: "pointer" };

// ── View: Single review ────────────────────────────────────────────────────

function SingleReview({ item, index, total, onApprove, onReject, onCorrect, onBack, onSkip }) {
  const [showProof, setShowProof] = useState(false);

  useEffect(() => {
    const h = (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
      const k = e.key.toLowerCase();
      if (k === "a") { e.preventDefault(); onApprove(item.id); }
      else if (k === "e") { e.preventDefault(); onCorrect(item); }
      else if (k === "r") { e.preventDefault(); onReject(item.id); }
      else if (k === "p") { e.preventDefault(); setShowProof(s => !s); }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [item, onApprove, onReject, onCorrect]);

  const rows = Object.entries(item.fields);

  return (
    <div style={{ maxWidth: 760, margin: "0 auto" }}>
      <ViewHeader onBack={onBack} title="Match review" sub={`Item ${index + 1} of ${total} · ${item.vendor} ${item.part}`} accent={C.review}
        right={<Pill color={confColor(item.conf)} bg={C.reviewBg}>{Math.round(item.conf * 100)}% confidence</Pill>} />

      <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 12, overflow: "hidden" }}>
        <div style={{ display: "grid", gridTemplateColumns: "130px 1fr 1fr", background: C.panel2, padding: "10px 16px", fontFamily: sans, fontSize: 11.5, color: C.inkFaint, fontWeight: 500, textTransform: "uppercase", letterSpacing: 0.3 }}>
          <div>Field</div>
          <div>↓ Import · 7501</div>
          <div>↓ Export · BOL</div>
        </div>
        {rows.map(([key, f]) => {
          const flagged = key === item.uncertain;
          return (
            <div key={key} style={{
              display: "grid", gridTemplateColumns: "130px 1fr 1fr", padding: "12px 16px",
              borderTop: `1px solid ${C.lineSoft}`, alignItems: "center",
              background: flagged ? C.reviewBg : "transparent",
            }}>
              <div style={{ fontFamily: sans, fontSize: 12.5, color: flagged ? C.review : C.inkSoft, fontWeight: flagged ? 600 : 400 }}>
                {f.label}{flagged && " ⚠"}
              </div>
              <div style={{ fontFamily: mono, fontSize: 13, color: C.ink }}>{f.imp}</div>
              <div style={{ fontFamily: mono, fontSize: 13, color: C.ink }}>
                {f.exp}
                {f.ok && !flagged && <span style={{ color: C.pass, marginLeft: 6 }}>✓</span>}
                {f.note && <span style={{ color: f.ok ? C.pass : C.review, fontSize: 11, marginLeft: 6, fontFamily: sans }}>{f.note}</span>}
              </div>
            </div>
          );
        })}

        <div style={{ display: "flex", gap: 11, padding: "13px 16px", background: C.accentBg, borderTop: `1px solid ${C.lineSoft}` }}>
          <span style={{ color: C.accent, fontSize: 16, lineHeight: 1.2 }}>◆</span>
          <div style={{ fontFamily: sans, fontSize: 13, color: C.inkSoft, lineHeight: 1.55 }}>
            <span style={{ color: C.ink, fontWeight: 500 }}>{item.suggestion.text}.</span> {item.suggestion.detail}.
          </div>
        </div>

        <div style={{ borderTop: `1px solid ${C.lineSoft}` }}>
          <button onClick={() => setShowProof(s => !s)} style={{ width: "100%", textAlign: "left", background: "none", border: "none", cursor: "pointer", padding: "11px 16px", fontFamily: sans, fontSize: 12.5, color: C.accent, display: "flex", alignItems: "center", gap: 7 }}>
            <span style={{ fontSize: 11 }}>{showProof ? "▾" : "▸"}</span> Source proof — {item.proof.source} <Key>P</Key>
          </button>
          {showProof && (
            <div style={{ margin: "0 16px 14px", padding: "11px 13px", background: C.bg, border: `1px solid ${C.line}`, borderRadius: 7, fontFamily: mono, fontSize: 12, color: C.inkSoft, lineHeight: 1.7 }}>
              {renderProof(item.proof)}
            </div>
          )}
        </div>
      </div>

      <div style={{ display: "flex", gap: 10, marginTop: 16, flexWrap: "wrap", alignItems: "center" }}>
        <button onClick={() => onApprove(item.id)} style={primaryBtn(C.pass)}>Approve match <Key>A</Key></button>
        <button onClick={() => onCorrect(item)} style={ghostBtn()}>Correct field <Key>E</Key></button>
        <button onClick={() => onReject(item.id)} style={ghostBtn()}>Reject <Key>R</Key></button>
        <button onClick={onSkip} style={{ ...ghostBtn(), marginLeft: "auto", borderColor: "transparent", color: C.inkFaint }}>Skip for now →</button>
      </div>
    </div>
  );
}

function renderProof(p) {
  const parts = p.line.split(p.highlight);
  return (
    <span>
      {parts[0]}
      <span style={{ background: C.reviewBg, color: C.review, padding: "1px 5px", borderRadius: 3, border: `1px solid ${C.review}55` }}>{p.highlight}</span>
      {parts[1]}
    </span>
  );
}

// ── View: Correction form ──────────────────────────────────────────────────

function CorrectionForm({ item, onSave, onCancel }) {
  const [field, setField] = useState(FIELD_OPTIONS[0]);
  const [corrected, setCorrected] = useState(item.suggestion.text);
  const [reason, setReason] = useState(REASON_CODES[0]);
  const [note, setNote] = useState("");
  const [asRule, setAsRule] = useState(true);
  const impact = 9; // backend would return how many queued matches this resolves

  return (
    <div style={{ maxWidth: 620, margin: "0 auto" }}>
      <ViewHeader onBack={onCancel} title="Correct match" sub={`${item.vendor} ${item.part}`} accent={C.review} backLabel="Cancel" />

      <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 12, padding: "20px 22px" }}>
        <Field label="Field being corrected">
          <select value={field} onChange={e => setField(e.target.value)} style={inputStyle}>
            {FIELD_OPTIONS.map(o => <option key={o}>{o}</option>)}
          </select>
        </Field>

        <div style={{ display: "flex", gap: 12 }}>
          <Field label="System proposed" flex>
            <div style={{ ...inputStyle, color: C.inkFaint, background: C.bg, display: "flex", alignItems: "center" }}>{item.suggestion.text}</div>
          </Field>
          <Field label="Corrected value" flex>
            <input value={corrected} onChange={e => setCorrected(e.target.value)} style={inputStyle} />
          </Field>
        </div>

        <Field label="Reason code">
          <select value={reason} onChange={e => setReason(e.target.value)} style={inputStyle}>
            {REASON_CODES.map(o => <option key={o}>{o}</option>)}
          </select>
        </Field>

        <Field label="Note (optional, for audit)">
          <textarea value={note} onChange={e => setNote(e.target.value)} rows={2} placeholder="e.g. Confirmed against packing list PL-4471." style={{ ...inputStyle, resize: "vertical", lineHeight: 1.5, padding: "9px 12px" }} />
        </Field>

        <label style={{ display: "flex", gap: 11, padding: "13px 14px", background: C.accentBg, borderRadius: 8, cursor: "pointer", marginTop: 4 }}>
          <input type="checkbox" checked={asRule} onChange={e => setAsRule(e.target.checked)} style={{ ...cbStyle, accentColor: C.accent, marginTop: 2 }} />
          <span style={{ fontFamily: sans, fontSize: 13, color: C.inkSoft, lineHeight: 1.55 }}>
            Save as reusable rule — apply <b style={{ color: C.ink, fontWeight: 600 }}>{corrected}</b> to future matches from <span style={{ fontFamily: mono }}>{item.vendor}</span> part <span style={{ fontFamily: mono }}>{item.part}</span>.
            {asRule && <span style={{ display: "block", marginTop: 3, color: C.accent }}>Auto-resolves {impact} matches currently in this queue.</span>}
          </span>
        </label>

        <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
          <button onClick={() => onSave({ field, corrected, reason, note, asRule, impact })} style={primaryBtn(C.review)}>Save correction</button>
          <button onClick={onCancel} style={ghostBtn()}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

function Field({ label, children, flex }) {
  return (
    <div style={{ marginBottom: 14, flex: flex ? 1 : undefined }}>
      <label style={{ display: "block", fontFamily: sans, fontSize: 12.5, fontWeight: 500, color: C.inkSoft, marginBottom: 6 }}>{label}</label>
      {children}
    </div>
  );
}

const inputStyle = {
  width: "100%", boxSizing: "border-box", height: 38, padding: "0 12px",
  fontFamily: sans, fontSize: 13.5, color: C.ink, background: C.panel2,
  border: `1px solid ${C.line}`, borderRadius: 7, outline: "none",
};

// ── Shared header + buttons ─────────────────────────────────────────────────

function ViewHeader({ onBack, title, sub, accent, right, backLabel = "Back", }) {
  return (
    <div style={{ marginBottom: 20 }}>
      <button onClick={onBack} style={{ background: "none", border: "none", color: C.inkFaint, fontFamily: sans, fontSize: 12.5, cursor: "pointer", padding: 0, marginBottom: 12 }}>
        ← {backLabel}
      </button>
      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
        <span style={{ width: 3, height: 26, background: accent, borderRadius: 2 }} />
        <h2 style={{ fontFamily: sans, fontSize: 20, fontWeight: 600, margin: 0, color: C.ink, letterSpacing: -0.2 }}>{title}</h2>
        {right && <div style={{ marginLeft: "auto" }}>{right}</div>}
      </div>
      <div style={{ fontFamily: sans, fontSize: 13, color: C.inkSoft, marginLeft: 15, marginTop: 3 }}>{sub}</div>
    </div>
  );
}

function primaryBtn(accent, disabled) {
  return {
    fontFamily: sans, fontSize: 13.5, fontWeight: 500, color: C.bg, background: accent,
    border: "none", borderRadius: 8, padding: "9px 16px", cursor: disabled ? "not-allowed" : "pointer",
    opacity: disabled ? 0.4 : 1, display: "inline-flex", alignItems: "center",
  };
}
function ghostBtn(disabled) {
  return {
    fontFamily: sans, fontSize: 13.5, fontWeight: 500, color: C.ink, background: "transparent",
    border: `1px solid ${C.line}`, borderRadius: 8, padding: "9px 16px",
    cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.4 : 1,
    display: "inline-flex", alignItems: "center",
  };
}

// ── Toast ────────────────────────────────────────────────────────────────

function Toast({ msg }) {
  if (!msg) return null;
  return (
    <div style={{
      position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)",
      background: C.panel2, border: `1px solid ${C.line}`, borderLeft: `3px solid ${msg.color}`,
      borderRadius: 9, padding: "11px 18px", fontFamily: sans, fontSize: 13, color: C.ink,
      boxShadow: "0 8px 28px rgba(0,0,0,0.4)", zIndex: 50, maxWidth: 420,
    }}>{msg.text}</div>
  );
}

// ── App shell ───────────────────────────────────────────────────────────────

function App() {
  const [view, setView] = useState("overview"); // overview | bulk | review | correct
  const [bulkRows, setBulkRows] = useState(HIGH_CONF);
  const [queue, setQueue] = useState(REVIEW_QUEUE);
  const [reviewIdx, setReviewIdx] = useState(0);
  const [correcting, setCorrecting] = useState(null);
  const [stats, setStats] = useState({ autoPass: HIGH_CONF.length, review: REVIEW_QUEUE.length, approved: 0, rejected: 0 });
  const [toast, setToast] = useState(null);

  const flash = useCallback((text, color) => {
    setToast({ text, color });
    setTimeout(() => setToast(null), 2600);
  }, []);

  const approveBulk = (ids) => {
    setBulkRows(rows => rows.filter(r => !ids.includes(r.id)));
    setStats(s => ({ ...s, autoPass: s.autoPass - ids.length, approved: s.approved + ids.length }));
    flash(`${ids.length} matches approved and written to the audit trail.`, C.pass);
    setView("overview");
  };

  const sendBulkToReview = (ids) => {
    setBulkRows(rows => rows.filter(r => !ids.includes(r.id)));
    setStats(s => ({ ...s, autoPass: s.autoPass - ids.length, review: s.review + ids.length }));
    flash(`${ids.length} match${ids.length === 1 ? "" : "es"} routed to detailed review.`, C.review);
  };

  const advance = (afterRemove) => {
    setQueue(q => {
      const next = q.filter((_, i) => i !== reviewIdx);
      if (next.length === 0) { setView("overview"); }
      else { setReviewIdx(i => Math.min(i, next.length - 1)); }
      return next;
    });
  };

  const approveOne = (id) => {
    setStats(s => ({ ...s, review: s.review - 1, approved: s.approved + 1 }));
    flash("Match approved. Advancing to next.", C.pass);
    advance();
  };
  const rejectOne = (id) => {
    setStats(s => ({ ...s, review: s.review - 1, rejected: s.rejected + 1 }));
    flash("Match rejected. Import line returned to the unmatched pool.", C.reject);
    advance();
  };
  const skip = () => setReviewIdx(i => (i + 1) % queue.length);

  const saveCorrection = (data) => {
    setCorrecting(null);
    if (data.asRule) {
      setStats(s => ({ ...s, review: Math.max(0, s.review - data.impact), approved: s.approved + data.impact }));
      flash(`Correction saved · rule created · ${data.impact} matches auto-resolved.`, C.accent);
      setQueue(q => q.filter((_, i) => i !== reviewIdx));
      setView("overview");
    } else {
      flash("Correction saved to this match and the audit trail.", C.pass);
      setStats(s => ({ ...s, review: s.review - 1, approved: s.approved + 1 }));
      advance();
    }
  };

  const reviewItem = queue[reviewIdx];

  return (
    <div style={{ minHeight: "100vh", background: C.bg, padding: "40px 24px 80px", fontFamily: sans }}>
      <style>{`
        * { box-sizing: border-box; }
        button:hover:not(:disabled) { filter: brightness(1.08); }
        select, input, textarea { font-family: ${sans}; }
        select:focus, input:focus, textarea:focus { border-color: ${C.accent} !important; }
        ::placeholder { color: ${C.inkFaint}; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
      `}</style>

      <div style={{ maxWidth: 960, margin: "0 auto 28px", display: "flex", alignItems: "center", gap: 10 }}>
        <div style={{ width: 8, height: 8, borderRadius: 2, background: C.review }} />
        <span style={{ fontFamily: mono, fontSize: 13, letterSpacing: 1, color: C.inkSoft, textTransform: "uppercase" }}>
          Drawback · Match Reviewer
        </span>
      </div>

      {view === "overview" && (
        <Overview stats={stats} onGoBulk={() => setView("bulk")} onGoReview={() => { if (queue.length) { setReviewIdx(0); setView("review"); } }} />
      )}
      {view === "bulk" && (
        <BulkApprove rows={bulkRows} onApprove={approveBulk} onSendToReview={sendBulkToReview} onBack={() => setView("overview")} />
      )}
      {view === "review" && reviewItem && !correcting && (
        <SingleReview item={reviewItem} index={reviewIdx} total={queue.length}
          onApprove={approveOne} onReject={rejectOne} onCorrect={(it) => setCorrecting(it)}
          onBack={() => setView("overview")} onSkip={skip} />
      )}
      {view === "review" && correcting && (
        <CorrectionForm item={correcting} onSave={saveCorrection} onCancel={() => setCorrecting(null)} />
      )}

      <Toast msg={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
